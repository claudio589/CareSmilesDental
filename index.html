function fmt(s){ return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'; }
// Paid Google traffic can arrive two ways on this account:
//  1) a dedicated per-channel number pool, e.g. "Google Ads Assets | X" or
//     "Google Local Services Ads | X" (source_name says it outright)
//  2) a shared "Website Pool | Search PPC | X" pool, where the channel is only
//     distinguishable via utm_source/medium (cpc = Ads, local = LSA, organic = NOT paid)
function isPaidGoogle(c){
  // Use CallRail's authoritative `source` attribution field (matches the CallRail UI
  // "Sources" filter exactly). The old source_name/utm heuristic was wrong both ways:
  // it missed paid pools not named "google" (Website Pool | Search PPC, GMB | GBP) and
  // swept in the organic "Google My Business" source. Always trust `source`.
  var s = c.source || '';
  // Also count calls CallRail tagged as Google paid search (utm_source=google,
  // medium cpc/ppc) even when the number's source is mislabeled (e.g. some
  // clients' "Website - calls only" numbers is set to "All Search").
  var tagged = /^google$/i.test(c.utm_source || '') && /^(cpc|ppc)$/i.test(c.medium || '');
  if(s !== 'Google Ads' && s !== 'Google Local Services Ads' && !tagged) return false;
  // Exclude calls that CallRail attributed to an ad but that actually rang the
  // organic Google My Business listing number — they are not real ad-number calls.
  return !isGMBListingNumber(c);
}
function isGMBListingNumber(c){
  var sn = (c.source_name || '').toLowerCase();
  return (/google\s*my\s*business/.test(sn) || /^gmb\b/.test(sn)) && !/gbp/.test(sn);
}
function adChannel(c){
  // Isolate each paid call by the tracking-number POOL it rang through:
  //   lsa    = Local Services Ads number
  //   assets = Google Ads "Assets" number (call/asset extensions)
  //   pool   = Search / Website dynamic swap-number pool (incl. GBP ad pools)
  //   other  = paid-attributed but via a non-ad number (e.g. the GMB listing #)
  var sn = (c.source_name || '').toLowerCase();
  if(/local\s*service/.test(sn)) return 'lsa';
  if(/assets/.test(sn)) return 'assets';
  if(/pool|search\s*ppc|\bppc\b|website|\bgbp\b/.test(sn)) return 'pool';
  return 'other';
}
// LSA is now isolated by the number that rang (matches CallRail "LSA" number pool),
// not just CallRail's source attribution.
function isLSA(c){ return adChannel(c) === 'lsa'; }
function fmtPhone(p){ p=String(p||'').replace(/[^0-9]/g,''); if(p.length===11&&p.charAt(0)==='1') p=p.slice(1); if(p.length===10) return '('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6); return String(p||'')||'\u2014'; }

// ── CAMPAIGNS & KEYWORDS ──────────────────────────────────────────────────────
// Which Google Ads keywords/campaigns turn calls into NEW patients vs which pull
// volume but never book. "New patients" = outcome New Appointment Booked. Google
// Ads search keywords only (LSA has no keyword; untracked pools roll up to campaign).
// Top Loss uses the v5 disposition category.
function campEsc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function campDur(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function campRows(keyFn){
  var m={};
  calls.forEach(function(c){
    var k=(keyFn(c)||'').trim() || '(no keyword)';
    var o=m[k]||(m[k]={calls:0,ana:0,booked:0,lost:0,dur:0,lossCat:{}});
    o.calls++; o.dur+=(c.duration||0);
    var x=cache[c.id];
    if(x&&!x.not_analyzed){ o.ana++;
      if(x.outcome==='New Appointment Booked') o.booked++;
      else if(x.lost_reason){ o.lost++; var cat=driverCategory(x.lost_reason)||'Other'; o.lossCat[cat]=(o.lossCat[cat]||0)+1; }
    }
  });
  return Object.keys(m).map(function(k){ var o=m[k];
    var tl=Object.keys(o.lossCat).sort(function(a,b){return o.lossCat[b]-o.lossCat[a];})[0]||'—';
    return {key:k,calls:o.calls,ana:o.ana,booked:o.booked,lost:o.lost,topLoss:tl,
            bookRate:o.ana?Math.round(o.booked/o.ana*100):null,avgDur:Math.round(o.dur/o.calls)};
  }).sort(function(a,b){return b.calls-a.calls;});
}

    '<div class="strip win"><h4><span class="dot g"></span>Converting search terms → new patients</h4>'+(winners.length?winners.map(winRow).join(''):'<div class="mut sm">None booked yet (fills in as calls analyze).</div>')+'</div>'+
    '<div class="strip leak"><h4><span class="dot r"></span>Search terms not converting</h4><div class="strip-sub">&#8805;4 calls, booking below the '+avgRate+'% account average &middot; negative-keyword / bid-down candidates</div>'+(leakers.length?leakers.map(leakRow).join(''):'<div class="mut sm">None under-converting with volume yet.</div>')+'</div></div>';
  var note='<div class="camp-note">Which Google Ads <b>keywords</b> and <b>campaigns</b> turn calls into <b>new patients</b> (= New Appointment Booked). Google Ads <b>search keywords</b> only — LSA has no keyword and untracked pools roll up to campaign. Green = converting, red = calls with zero bookings (negative-keyword / bid-down candidates). Fills in as calls analyze.</div>';
  el.innerHTML = css + note + strips +
    campTable('By keyword','Top 30 keywords by call volume', kw.slice(0,30), 'Keyword') +
    campTable('By campaign','Volume and conversion per Google Ads campaign', camps, 'Campaign');
}

function baseFiltered(){
  if(activeF==='booked') return calls.filter(function(c){return cache[c.id]&&cache[c.id].outcome==='New Appointment Booked';});
  if(activeF==='lost')   return calls.filter(function(c){var x=cache[c.id];return x&&!x.not_analyzed&&x.outcome!=='New Appointment Booked';});
  if(activeF==='lsa')    return calls.filter(isLSA);
  if(activeF==='ads')    return calls.filter(function(c){return !isLSA(c);});
  return calls;
}
// Also filter by the selected driver — matches the call's PRIMARY driver, or any of
// its drivers (secondary/tertiary), so you can drill into "which calls have this reason".
function getFiltered(){ var _b=_getFilteredBase(); return LOG_FILTER ? _b.filter(function(c){ return LOG_FILTER.fn(nz(c)); }) : _b; }
function _getFilteredBase(){
  var base = baseFiltered();
  if(activeDriver){
    var _catMode = activeDriver.indexOf('cat:')===0, _wantCat = _catMode ? activeDriver.slice(4) : null;
    base = base.filter(function(c){ var x=cache[c.id];
      if(!x || x.not_analyzed) return false;
      if(_catMode){
        if(driverCategory(x.primary_driver)===_wantCat) return true;
        return (x.drivers||[]).some(function(d){ return d && driverCategory(d.label)===_wantCat; });
      }
      if(x.primary_driver===activeDriver) return true;
      return (x.drivers||[]).some(function(d){ return d && d.label===activeDriver; });
    });
  }
  return base;
}

// Rebuild the driver dropdown from the calls in the current pill view, each with a
// live count. Keeps the current selection (even if it drops to 0 in the new view).
function rebuildDriverOptions(){
  var sel=document.getElementById('drvSel'); if(!sel) return;
  var base=baseFiltered(), counts={}, analyzed=0;
  base.forEach(function(c){ var x=cache[c.id]; if(!x||x.not_analyzed) return; analyzed++; if(x.primary_driver) counts[x.primary_driver]=(counts[x.primary_driver]||0)+1; });
  var esc=function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); };
  var prev=activeDriver, byCat={};
  Object.keys(counts).forEach(function(k){ var cat=driverCategory(k)||'Other'; (byCat[cat]=byCat[cat]||[]).push(k); });
  var order=LOST_CAT_ORDER.concat(['Booked (Won)','Other']).filter(function(c){ return byCat[c]; });
  Object.keys(byCat).forEach(function(c){ if(order.indexOf(c)<0) order.push(c); });
  var html='<option value="">All reasons ('+analyzed+')</option>';
  order.forEach(function(cat){
    var leaves=byCat[cat].sort(function(a,b){ return counts[b]-counts[a]; });
    var tot=leaves.reduce(function(s,k){ return s+counts[k]; },0);
    html+='<optgroup label="'+esc(cat)+' ('+tot+')">';
    html+='<option value="cat:'+esc(cat)+'"'+(('cat:'+cat)===prev?' selected':'')+'>▸ All '+esc(cat)+' ('+tot+')</option>';
    leaves.forEach(function(k){ html+='<option value="'+esc(k)+'"'+(k===prev?' selected':'')+'>&nbsp;&nbsp;'+esc(k)+' ('+counts[k]+')</option>'; });
    html+='</optgroup>';
  });
  if(prev && prev.indexOf('cat:')!==0 && !counts[prev]){ html+='<option value="'+esc(prev)+'" selected>'+esc(prev)+' (0)</option>'; }
  sel.innerHTML=html;
}

function cleanLeadExplanation(raw) {
  if(!raw) return '';
  // Remove scoring references: "(23 points)", "(23 points).", "23/25 for Need"
  var text = raw
    .replace(/\(\d+\s*\/\s*\d+\s*(?:points?)?\)/gi, '')
    .replace(/\(\d+\s*points?\)/gi, '')
    .replace(/\d+\s*\/\s*25\s+for\s+\w+/gi, '')
    .replace(/\(\s*\d+\s*\)/g, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\.\s*\./g, '.')
    .trim();

  // Clean up dangling punctuation from removals
  text = text.replace(/—\s*\./g, '.').replace(/,\s*\./g, '.').replace(/;\s*\./g, '.');

  // Split into sentences, remove very short/empty ones, rejoin cleanly
  var sentences = text.split(/(?<=[.!?])\s+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 15; });

  return sentences.join(' ');
}

         +   '<div class="an-cell"><div class="an-lbl">Lead quality</div><div class="an-val" style="color:' + (LQ[xa.lead_quality] || '#888') + '">' + (xa.lead_quality ? xa.lead_quality.toUpperCase() : '--') + '</div></div>'

  var outcomePill = '';

// ══ V6 INSIGHTS LAYER ═════════════════════════════════════════════════════════
// Every renderer reads calls through nz(), which normalises Claude (v6) results,
// the local fallback analyzer and voicemail rules into one shape, so buckets,
// drill-downs and filters never disagree with each other.
var BOOKED_OUTCOMES = ['New Appointment Booked','Rescheduled'];
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nz(c){
  var x = cache[c.id];
  var o = {c:c, x:x, analyzed:!!(x && !x.not_analyzed)};
  o.missed = !c.answered || (x && x.outcome==='Missed / No Answer');
  o.outcome = o.missed ? 'Missed / No Answer' : (o.analyzed ? x.outcome : null);
  o.booked = !!(o.analyzed && BOOKED_OUTCOMES.indexOf(x.outcome)>=0);
  o.newBooked = !!(o.analyzed && x.outcome==='New Appointment Booked');
  o.existingKept = !!(o.analyzed && (x.outcome==='Confirmed Existing' || x.outcome==='Rescheduled'));
  o.proc = o.analyzed && x.procedure && x.procedure!=='Unknown' ? x.procedure : (o.missed ? 'No conversation' : 'Unclassified');
  o.procCat = o.analyzed ? (x.procedure_category || procCategoryOf(x.procedure)) : (o.missed ? 'No Conversation' : 'Unclassified');
  if(o.procCat==='Unclassified' && o.missed) o.procCat='No Conversation';
  o.reasonSub = o.analyzed ? (x.reason_secondary || x.primary_driver || x.lost_reason || null) : null;
  o.reasonMain = o.reasonSub ? driverCategory(o.reasonSub) : null;
  if(o.missed){ o.reasonMain='Communication & Connection'; o.reasonSub = (x && x.primary_driver) || 'Missed / Voicemail'; }
  o.patientType = o.analyzed && x.patient_type ? x.patient_type : (c.first_call===true ? 'New Patient' : c.first_call===false ? 'Existing Patient' : 'Unknown');
  if(o.missed) o.opp = false;
  else if(o.analyzed && typeof x.is_opportunity==='boolean') o.opp = x.is_opportunity;
  else if(o.missed) o.opp = false;
  else if(o.analyzed) o.opp = o.booked || (o.reasonMain!=='Not a Valid Lead' && x.outcome!=='Confirmed Existing');
  else o.opp = false;
  o.notBookedOpp = o.opp && !o.booked && !o.existingKept;
  o.oppType = (o.analyzed && x.opportunity_type) || null;
  if(!o.oppType){
    if(o.missed) o.oppType='Callback — Missed / Voicemail';
    else if(o.analyzed && x.outcome==='Cancelled') o.oppType='Reschedule Recovery';
    else if(o.analyzed && x.outcome==='Referred Out') o.oppType='Referral — Warm Handoff';
    else if(o.notBookedOpp && (o.reasonMain==='Insurance & Coverage' || o.reasonMain==='Cost & Financial')) o.oppType='Insurance / Financing Follow-up';
    else if(o.notBookedOpp && o.reasonMain==='Caller Not Ready') o.oppType='Treatment / Consult Follow-up';
    else if(o.notBookedOpp) o.oppType='Callback — Unbooked New Patient';
    else if(o.analyzed && x.flag_priority) o.oppType='Coaching — Front Desk Gap';
  }
  o.priority = (o.analyzed && x.flag_priority) || (o.oppType ? (o.notBookedOpp && x && (x.lead_quality==='hot' || x.urgency==='Emergency') ? 'high' : o.missed ? 'medium' : 'low') : null);
  o.score = o.analyzed && x.agent_score!=null ? x.agent_score : null;
  return o;
}

var DRILL_OPEN = {};
function toggleDrill(id){ DRILL_OPEN[id]=!DRILL_OPEN[id]; renderCharts(); }
function statCells(st, opts){
  var conv = st.opp ? rate(st.booked, st.opp) : null;
  var cells = '<td class="num">'+st.n+'</td>';
  if(opts.cols.indexOf('opp')>=0) cells+='<td class="num">'+st.opp+'</td>';
  if(opts.cols.indexOf('booked')>=0) cells+='<td class="num g">'+st.booked+'</td>';
  if(opts.cols.indexOf('lost')>=0) cells+='<td class="num r">'+st.lost+'</td>';
  if(opts.cols.indexOf('conv')>=0) cells+='<td class="conv">'+(conv==null?'<span class="mut">--</span>':'<div class="cbar"><span style="width:'+conv+'%;background:'+sc(conv)+'"></span></div><b>'+conv+'%</b>')+'</td>';
  if(opts.cols.indexOf('share')>=0) cells+='<td class="conv"><div class="cbar"><span style="width:'+st.share+'%;background:'+(opts.shareColor||'#185FA5')+'"></span></div><b>'+st.share+'%</b></td>';
  if(opts.cols.indexOf('top')>=0) cells+='<td class="top">'+(st.top?esc(st.top):'<span class="mut">--</span>')+'</td>';
  return cells;
}
function groupStats(list, total, topFn){
  var st={n:list.length, opp:0, booked:0, lost:0};
  var tops={};
  list.forEach(function(o){ if(o.opp) st.opp++; if(o.booked && o.opp) st.booked++; if(o.notBookedOpp) st.lost++; if(topFn){ var k=topFn(o); if(k) tops[k]=(tops[k]||0)+1; } });
  st.share = rate(list.length, total||1);
  var tk=Object.keys(tops).sort(function(a,b){return tops[b]-tops[a];}); st.top = tk.length ? tk[0]+' ('+tops[tk[0]]+')' : '';
  return st;
}
// groups: [{key,label,list,children:[{label,list}], badge}]
function drillTable(id, title, sub, groups, opts){
  var total = groups.reduce(function(s,g){return s+g.list.length;},0);
  var head = {opp:'Opp.',booked:'Booked',lost:'Not booked',conv:'Conversion',share:'Share',top:opts.topLabel||'Top reason'};
  var th = '<th>'+esc(opts.firstCol||'Category')+'</th><th class="num">Calls</th>'+opts.cols.map(function(k){ return '<th class="'+(k==='conv'||k==='share'||k==='top'?'':'num')+'">'+head[k]+'</th>'; }).join('');
  var rows = groups.filter(function(g){return g.list.length;}).sort(function(a,b){return b.list.length-a.list.length;}).map(function(g){
    var open = !!DRILL_OPEN[id+'|'+g.label];
    var st = groupStats(g.list, total, opts.topFn);
    var fi = df((opts.filterPrefix||'')+g.label, g.fn);
    var hasKids = g.children && g.children.filter(function(k){return k.list.length;}).length>0;
    var r = '<tr class="dmain'+(open?' open':'')+'">'+
      '<td class="dl">'+(hasKids?'<button class="dtog" onclick="toggleDrill(\''+esc(id+'|'+g.label).replace(/'/g,"\\'")+'\')" aria-expanded="'+open+'">'+(open?'▾':'▸')+'</button>':'<span class="dtog-sp"></span>')+
        '<a href="javascript:void(0)" onclick="goDF('+fi+')">'+esc(g.label)+'</a>'+(g.badge?'<span class="dbadge">'+esc(g.badge)+'</span>':'')+'</td>'+statCells(st, opts)+'</tr>';
    if(open && hasKids){
      r += g.children.filter(function(k){return k.list.length;}).sort(function(a,b){return b.list.length-a.list.length;}).map(function(k){
        var ks = groupStats(k.list, total, opts.topFn), ki = df((opts.filterPrefix||'')+g.label+' › '+k.label, k.fn);
        return '<tr class="dsub"><td class="dl"><span class="dtog-sp"></span><a href="javascript:void(0)" onclick="goDF('+ki+')">'+esc(k.label)+'</a></td>'+statCells(ks, opts)+'</tr>';
      }).join('');
    }
    return r;
  }).join('');
  if(!rows) rows = '<tr><td colspan="9" class="empt-row">Populates as calls are transcribed and analyzed.</td></tr>';
  return '<div class="dcard"><div class="dhead"><div><h3>'+esc(title)+'</h3><div class="csub">'+sub+'</div></div></div>'+
         '<div class="dscroll"><table class="dtab"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function bucket(list, keyFn){ var m={}; list.forEach(function(o){ var k=keyFn(o); if(!k) return; (m[k]=m[k]||[]).push(o); }); return m; }

// ── funnel + stage scoreboard ────────────────────────────────────────────────
function renderFunnel(N){
  var t=N.length, live=N.filter(function(o){return !o.missed;}).length, opp=N.filter(function(o){return o.opp;}).length, bk=N.filter(function(o){return o.opp && o.booked;}).length;
  var steps=[['Paid calls',t,null],['Live conversations',live,df('Live conversations',function(o){return !o.missed;})],['Opportunities',opp,df('Opportunities',function(o){return o.opp;})],['Booked',bk,df('Booked opportunities',function(o){return o.opp&&o.booked;})]];
  return '<div class="ccard"><h3>Call funnel</h3><div class="csub">Paid Google calls → booked appointments</div><div class="funnel">'+
    steps.map(function(s,i){ var w=t?Math.max(4,Math.round(s[1]/t*100)):0, prev=i?steps[i-1][1]:null;
      return '<div class="fstep"'+(s[2]!=null?' role="button" onclick="goDF('+s[2]+')"':'')+'><div class="flbl"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'+
        '<div class="fbar"><span style="width:'+w+'%"></span></div>'+
        '<div class="fsub">'+(prev!=null?rate(s[1],prev)+'% of previous step':'&nbsp;')+'</div></div>'; }).join('')+
    '</div></div>';
}
function renderStages(N){
  var scored=N.filter(function(o){return o.analyzed && o.x.scorecard && o.x.scorecard.length && o.x.engine==='claude';});
  var rows=STAGES.map(function(st){
    var vals=scored.map(function(o){ return (o.x.scorecard||[]).find(function(d){return d.key===st.key;}); }).filter(function(d){return d && !d.na;});
    var pct=vals.length?Math.round(vals.reduce(function(s,d){return s+d.score/d.max;},0)/vals.length*100):null;
    var weak=vals.filter(function(d){return d.score/d.max<0.6;}).length;
    var fi=df(st.label+' below 60%',function(o){ var d=o.analyzed&&(o.x.scorecard||[]).find(function(z){return z.key===st.key;}); return !!(d&&!d.na&&d.score/d.max<0.6); });
    return '<div class="srow" role="button" onclick="goDF('+fi+')" title="Show calls scoring under 60% on '+esc(st.label)+'">'+
      '<div class="sname">'+st.label+'<span>'+st.max+' pts</span></div>'+
      '<div class="sbar2"><span style="width:'+(pct||0)+'%;background:'+(pct==null?'#C3CCD5':sc(pct))+'"></span><i style="left:80%"></i></div>'+
      '<div class="sval" style="color:'+(pct==null?'var(--faint)':sc(pct))+'">'+(pct==null?'--':pct+'%')+'</div>'+
      '<div class="sweak">'+(vals.length?weak+' weak':'')+'</div></div>';
  }).join('');
  return '<div class="ccard"><h3>Front-desk scorecard</h3><div class="csub">Average per stage across '+scored.length+' AI-graded calls · target line 80% · click a stage for weak calls</div><div class="stages">'+rows+'</div></div>';
}

// ── heatmap: when calls arrive and get missed ────────────────────────────────
function renderHeat(N){
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], H0=7, H1=20, grid={}, mx=0;
  var fmtP=new Intl.DateTimeFormat('en-US',{timeZone:PRACTICE_TZ,weekday:'short',hour:'numeric',hour12:false});

  return '<div class="recbox" id="'+pfx+c.id+'" onclick="event.stopPropagation()">'+
    '<button class="recbtn" onclick="playRec(\''+c.id+'\',\''+pfx+'\')">▶ Play recording</button>'+

async function playRec(id,pfx){ pfx=pfx||'rec-';
  var c=calls.find(function(z){return z.id===id;}); var box=document.getElementById(pfx+id); if(!c||!box) return;
  box.innerHTML='<span class="mut">Loading recording…</span>';
  var url=REC_URL[id]; if(!url){ url=await getSignedUrl(c); if(url) REC_URL[id]=url; }
  if(!url){ box.innerHTML='<span class="mut">Recording unavailable — open it in CallRail.</span>'; return; }
  box.innerHTML='<audio controls autoplay preload="auto" src="'+esc(url)+'"></audio>'+
    '<div class="recspd">'+[1,1.25,1.5,2].map(function(r){ return '<button class="'+(r===1?'on':'')+'" onclick="recSpeed(\''+pfx+id+'\','+r+',this)">'+r+'×</button>'; }).join('')+'</div>';
  var au=box.querySelector('audio');
  au.addEventListener('error',function(){ delete REC_URL[id]; box.innerHTML='<span class="mut">Recording link expired — </span><button class="recbtn" onclick="playRec(\''+id+'\',\''+pfx+'\')">Retry</button>'; });

// ── Campaigns & keywords: opportunity-based, campaign → keyword drill ─────────
function kwNorm(k){
  if(!k) return null; var s=String(k).trim(), mt='Broad';
  if(/^\[.*\]$/.test(s)){ mt='Exact'; s=s.slice(1,-1); } else if(/^".*"$/.test(s)){ mt='Phrase'; s=s.slice(1,-1); }
  s=s.replace(/^\+/,'').replace(/\s\+/g,' ').toLowerCase().trim();
  return s ? {term:s, match:mt} : null;
}
function campName(c){ var v=(c.campaign||'').trim(); if(!v) return adChannel(c)==='lsa'?'Local Services Ads':'(no campaign data)'; if(/^lsa$/i.test(v)) return 'Local Services Ads'; return v; }
function kwStats(list){
  var st={n:list.length, opp:0, bk:0, lost:0, nonlead:0, missed:0, dur:0, sc:0, scn:0, rs:{}};
  list.forEach(function(o){ st.dur+=o.c.duration||0; if(o.missed) st.missed++; else if(o.analyzed&&!o.opp) st.nonlead++;
    if(o.opp){ st.opp++; if(o.booked) st.bk++; } if(o.notBookedOpp){ st.lost++; if(o.reasonSub) st.rs[o.reasonSub]=(st.rs[o.reasonSub]||0)+1; }
    if(o.opp&&o.score!=null){ st.sc+=o.score; st.scn++; } });
  st.conv=st.opp?rate(st.bk,st.opp):null; st.avgLen=st.n?Math.round(st.dur/st.n):0; st.avgSc=st.scn?Math.round(st.sc/st.scn):null;
  var t=Object.keys(st.rs).sort(function(a,b){return st.rs[b]-st.rs[a];})[0]; st.top=t?{sub:t,main:driverCategory(t),n:st.rs[t]}:null;
  return st;
}
var CAMP_OPEN={};

}

    var kids=Object.keys(byK).length>1 || !byK['(no keyword data)'];

  var strip=function(title,sub,dot,rows,val){ return '<div class="dcard"><h3><span class="sdot" style="background:'+dot+'"></span>'+title+'</h3><div class="csub">'+sub+'</div>'+

  var kwHtml=kwRows.map(function(r){ var fi=df('Keyword: '+r.k,function(o){var z=kwNorm(o.c.keywords);return z&&z.term===r.k;});

    '<div class="camp-note2">Conversion here is the same as on the Overview: <b>booked ÷ opportunities</b>. Wrong numbers, spam, vendors and missed calls are counted separately under <b>Missed / non-lead</b>, so a keyword is judged only on real patients. Account conversion: <b>'+acct+'%</b> ('+allBk+' of '+allOpp.length+'). '+noKw+' of '+N.length+' calls carry no keyword (LSA, call assets and untracked numbers) and roll up to their campaign only. Click any name to open its calls.</div>'+
    '<div class="drow three">'+
      strip('Keywords booking patients','Most new appointments','#1D9E75',winners,function(r){return '<b class="g">'+r.st.bk+' booked</b> · '+r.st.conv+'%';})+
      strip('Keywords under-converting','2+ opportunities, below the '+acct+'% account rate — bid-down or landing/handling review','#C2413F',leakers,function(r){return '<b class="r">'+r.st.lost+' not booked</b> · '+r.st.conv+'%';})+
      strip('Keywords attracting non-patients','Mostly wrong numbers, spam or vendors — negative-keyword candidates','#B7791F',junk,function(r){return '<b style="color:#8A5A12">'+r.st.nonlead+' non-lead</b> of '+r.st.n;})+
    '</div>'+
    '<div class="dcard"><h3>By campaign</h3><div class="csub">Expand a campaign to see its keywords.</div><div class="dscroll"><table class="dtab ctab"><thead>'+head+'</thead><tbody>'+campHtml+'</tbody></table></div></div>'+

// ══ FRONT-DESK STANDARD — what each scorecard stage expects ══════════════════
// Same rubric Claude grades against (see ANALYSIS_PROMPT), written for the team.
// Colour code is shared by the Overview, the standard cards and every call:
//   green ≥ 80% meets standard · amber 60–79% needs coaching · red < 60% below standard · grey not applicable
var FD_BANDS = [
  {min:80, key:'meets', label:'Meets standard', color:'#1D9E75', bg:'#E3F4EC'},
  {min:60, key:'coach', label:'Needs coaching', color:'#B7791F', bg:'#FBF3E4'},
  {min:0,  key:'below', label:'Below standard', color:'#C2413F', bg:'#FBEAEA'}
];
var FD_NA = {key:'na', label:'Not applicable', color:'#A9B4BF', bg:'#F1F4F7'};
function fdBand(p){ if(p==null) return FD_NA; for(var i=0;i<FD_BANDS.length;i++){ if(p>=FD_BANDS[i].min) return FD_BANDS[i]; } return FD_BANDS[FD_BANDS.length-1]; }
function fdColor(p){ return fdBand(p).color; }

var STAGE_STANDARD = {
  opening: {
    goal: 'The call is answered live, promptly and by someone ready to help.',

  greeting: {
    goal: 'The caller immediately knows where they called, who they are speaking to, and that they are welcome.',
    expect: [['Says the practice name',3],['Gives their own name',3],['Offers to help (“How can I help you today?”)',2],['Warm, unhurried, professional tone',2]],
    example: '“Thank you for calling {practice}, this is [your name]. How can I help you today?”',
    misses: ['“Dental office, hold please”','No agent name','Flat or rushed tone']

  discovery: {

    example: '“I understand. We are out of network with that plan, but our new-patient visit is self-pay friendly and we offer CareCredit. Would that work for you?”',
    misses: ['“No, we don’t take that” and the call ends','Quoting a price with no value or option attached','Letting “I’ll think about it” end the call'],

  solution_finding: {

    misses: ['No explanation of the visit','Vague or evasive about cost','Overloading with jargon']
  },
  closing: {
    goal: 'Ask for the appointment and secure a concrete next step on every bookable call.',
    expect: [['Asks for the appointment',6],['Offers two specific options (“Tuesday at 10 or Thursday at 2?”)',5],['Confirms date, time and details back to the caller',5],['If not booked: secures a tentative hold, a callback time, or sends forms / links',4]],
    example: '“I have Tuesday at 10 or Thursday at 2, which works better for you? … Great, Thursday at 2 with the doctor. I’ll text you the forms now.”',

function bandLegend(){

function stageAgg(N){
  var scored=N.filter(function(o){return o.analyzed && o.x.scorecard && o.x.scorecard.length && o.x.engine==='claude';});
  var out={}; STAGES.forEach(function(st){
    var vals=scored.map(function(o){ return (o.x.scorecard||[]).find(function(d){return d.key===st.key;}); }).filter(function(d){return d && !d.na;});
    var pct=vals.length?Math.round(vals.reduce(function(s,d){return s+d.score/d.max;},0)/vals.length*100):null;
    var cnt={meets:0,coach:0,below:0}; vals.forEach(function(d){ cnt[fdBand(Math.round(d.score/d.max*100)).key]++; });

}

        '<div class="fdr"><b style="color:'+b.color+'">'+(a.pct==null?'--':a.pct+'%')+'</b><span class="fdb" style="color:'+b.color+';background:'+b.bg+'">'+b.label+'</span></div></div>'+
      '<div class="fdg">'+esc(sd.goal)+'</div>'+
      '<div class="fdl">What we expect</div><ul class="fdx">'+sd.expect.map(function(e){ return '<li><span>'+esc(e[0])+'</span><b>'+e[1]+'</b></li>'; }).join('')+'</ul>'+
      (sd.na?'<div class="fdna">'+esc(sd.na)+'</div>':'')+
      '<div class="fdl">Sounds like</div><div class="fde">'+esc(exText(sd.example))+'</div>'+
      '<div class="fdl">Common misses</div><div class="fdm">'+sd.misses.map(esc).join(' · ')+'</div>'+
      '<div class="fdl">This period</div><div class="fdseg">'+(seg||'<span style="width:100%;background:#EDF1F5"></span>')+'</div>'+
      '<div class="fdsc">'+(tot?a.cnt.meets+' meet · '+a.cnt.coach+' coach · '+a.cnt.below+' below <span class="mut">of '+tot+' calls</span>':'<span class="mut">No graded calls yet</span>')+'</div>'+
    '</div>';
  }).join('');
  el.innerHTML='<div class="dcard" id="fdStandard"><div class="fdtop"><div><h3>Front-desk standard</h3><div class="csub">The behaviour expected at each stage of a call — the same rubric the AI grades against. Colour shows how the team is doing this period; click a colour segment to open those calls.</div></div>'+
    '<button class="fdtog" onclick="toggleStd()">'+(STD_OPEN?'Hide':'Show')+' standard</button></div>'+bandLegend()+
    (STD_OPEN?'<div class="fdgrid">'+cards+'</div>':'')+'</div>';
}
// Call log: per-call standard toggle
var CL_STD = {};
function curPractice(){ var L=LOCATIONS.find(function(l){return l.id===COMPANY_ID;}); return (L&&(L.practice||L.name))||'our office'; }
function exText(t){ return String(t||'').replace(/\{practice\}/g, curPractice()); }
function toggleCallStd(id){ CL_STD[id]=!CL_STD[id]; var c=calls.find(function(z){return z.id===id;}); if(c) refreshCard(c); }


// ── AUTO-LAUNCH ───────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async function(){
  // Step 1: load calls
  try {
    await loadCalls();
  } catch(e) {
    console.error('[OM] loadCalls failed:', e);
    showLoadError(e);
    return;
  }

  // Step 2: render cards and show dashboard
  try { render(); } catch(e){ console.error('[OM] render failed:', e); }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display    = 'block';

  // Step 3: transcript-first pipeline. Transcribes each answered+recorded call,
  // then categorizes from OUR transcript (never CallRail's summary). Missed and
  // untranscribable calls are settled as Missed / Not analyzed. Runs
  // progressively in the background so the UI populates as transcripts land.
  try {
    enrichTranscripts(calls);
  } catch(e) {
    console.error('[OM] enrichTranscripts failed:', e);
  }
});
</script>
