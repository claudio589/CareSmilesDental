<!DOCTYPE html>
<!-- OM Performance Marketing / CallRail dashboard -- CARE Smiles Dental (Hood River, OR) -- ported from the Meadowbrook v6 build (via Aurora) 2026-10-27 -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM · CARE Smiles Dental</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef2f6;--white:#fff;--border:#dbe3e9;--text:#0D2132;--muted:#5b6b78;
  --navy:#0D2132;--accent:#185FA5;--accent-bg:#e6f1fb;--accent-border:rgba(24,95,165,.28);--yellow:#F4EB2D;
  --red:#E24B4A;--red-lt:#fcebeb;--amber:#BA7517;--amber-lt:#faeeda;--blue:#185FA5;--blue-lt:#e6f1fb;
  --teal:#1D9E75;--radius:10px}
body{font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lmsg{font-size:14px;font-weight:500}.lsub{font-size:12px;color:var(--muted)}
.lbar-wrap{width:260px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.lbar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
#main{display:none}
.topbar{background:var(--navy);border-bottom:none;padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;color:#fff}
.top-l{display:flex;align-items:center;gap:11px}
.om-logo svg{height:19px;width:auto;display:block}
.om-sep{width:1px;height:20px;background:rgba(255,255,255,.28)}
.dot{display:none}
.top-name{font-size:14px;font-weight:600;letter-spacing:-.01em;color:#fff;font-family:'Poppins','Open Sans',sans-serif}
.top-badge{font-size:11px;color:#fff;background:var(--accent);padding:2px 10px;border-radius:20px;border:none;font-weight:600}
.top-r{display:flex;align-items:center;gap:7px}
.bsm{padding:.35rem .8rem;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:var(--white);font-family:inherit;color:var(--text)}
.bsm:hover{background:var(--bg)}
.bacc{background:var(--accent);color:#fff;border-color:var(--accent)}.bacc:hover{opacity:.9;background:var(--accent)}
.tstatus{font-size:11px;color:#aeb9c4}
.date-row{display:flex;align-items:center;gap:6px}
.date-input{padding:.3rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text)}
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto}
.nav-btn{padding:.85rem 1.2rem;border:none;background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
.nav-btn:hover{color:var(--text)}.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.view{display:none;padding:1.5rem}.view.active{display:block}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.25rem}
.kcard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem}
.kcard.acc{background:var(--accent-bg);border-color:var(--accent-border)}
.kval{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.klbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ksub{font-size:11px;color:var(--muted);margin-top:2px}
.crow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem}
.ccard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.ccard h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.csub{font-size:10px;color:var(--muted);margin-bottom:.5rem}
.cwrap{position:relative;height:160px}
.calls-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.calls-hdr{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.calls-hdr h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fp{display:flex;gap:6px}
.pill{font-size:11px;padding:.3rem .7rem;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--white);color:var(--muted);font-family:inherit}
.pill.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.ccols{display:grid;grid-template-columns:90px 1fr 110px 70px 80px 90px 28px;gap:8px;padding:.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.crow2{border-bottom:1px solid var(--border)}.crow2:last-child{border-bottom:none}
.chd{display:grid;grid-template-columns:90px 1fr 110px 70px 80px 90px 28px;gap:8px;padding:.75rem 1rem;cursor:pointer;align-items:center}
.chd:hover{background:var(--bg)}
.cdt{font-size:11px;color:var(--muted)}
.cname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.slsa{background:var(--blue-lt);color:var(--blue)}.sads{background:var(--amber-lt);color:var(--amber)}
.ab{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.ayes{background:#eaf3de;color:#3b6d11}.ano{background:var(--red-lt);color:#a32d2d}
.exp{font-size:13px;color:var(--muted);transition:transform .15s;text-align:center}
.crow2.open .exp{transform:rotate(180deg)}
.cdet{display:none;padding:1rem;background:var(--bg);border-top:1px solid var(--border)}
.crow2.open .cdet{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dbox{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.7rem .9rem}
.dlbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dtxt{font-size:12px;color:var(--muted);line-height:1.6}
.sbox{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.7rem .9rem;margin-bottom:8px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.acell{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.5rem .75rem}
.albl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.aval{font-size:12px;font-weight:600}
.sbarw{display:flex;align-items:center;gap:7px;margin-top:3px}
.sbart{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.sbarf{height:100%;border-radius:2px}
.obox{background:var(--amber-lt);border:1px solid rgba(186,117,23,.2);border-radius:7px;padding:.7rem .9rem;margin-top:8px}
.olbl{font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.drvbox{border-radius:7px;padding:.7rem .9rem;margin-top:8px;border-left:3px solid}
.banal{margin-top:8px;padding:.35rem .8rem;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.aia{font-size:12px;color:var(--muted);font-style:italic;padding:.5rem 0;display:flex;align-items:center;gap:7px}
.mspin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.opslist{display:flex;flex-direction:column;gap:10px}
.opsc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;display:flex;gap:12px}
.empt{padding:3rem;text-align:center;color:var(--muted);font-size:13px}
#progBanner{position:fixed;bottom:0;left:0;right:0;background:#0D2132;color:#fff;padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;z-index:999;font-size:12px;font-family:inherit;display:none}
@media(max-width:900px){.kgrid,.crow{grid-template-columns:repeat(2,1fr)}}

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; font-size: 11px; }
  .topbar { position: relative !important; background: #0D2132 !important; padding: .5rem 1rem; }
  .top-right { display: none !important; }
  .nav { display: none !important; }
  #progBanner { display: none !important; }
  .call-card-css-print { display: none; }
  /* Show only the active view */
  .view { display: none !important; }
  .view.active { display: block !important; padding: .5rem !important; }
  /* KPI grid */
  .kgrid { grid-template-columns: repeat(5,1fr) !important; gap: 6px !important; margin-bottom: .75rem !important; }
  .kcard { padding: .6rem .75rem !important; border: 1px solid #D9E0E7 !important; }
  .kval { font-size: 20px !important; }
  /* Charts */
  .crow { gap: 6px !important; margin-bottom: .75rem !important; }
  .ccard { padding: .6rem .75rem !important; }
  .cwrap { height: 130px !important; }
  /* Call cards */
  .call-card { break-inside: avoid; margin-bottom: 10px !important; border: 1px solid #ddd !important; }
  .cbody, .call-card-body { grid-template-columns: 160px 1fr !important; }
  .analyze-bar { display: none !important; }
  .ccols { display: none !important; }
  /* Ops cards */
  .opsc, .opscard { break-inside: avoid; }
  /* Filter pills hidden */
  .fp, .frow { display: none !important; }
  /* Page breaks */
  .kgrid { page-break-after: avoid; }
  h2, h3 { page-break-after: avoid; }
}


.pdf-btn {
  background: #0D2132;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: .35rem .9rem;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 5px;
}
.pdf-btn:hover { opacity: .85; }

</style>
<style id="call-card-css">
.call-card{background:#fff;border:1px solid #D9E0E7;border-radius:10px;margin-bottom:14px;overflow:hidden;border-left:4px solid #D9E0E7}
.call-card.booked{border-left-color:#1D9E75}
.call-card.not-booked{border-left-color:#E24B4A}
.call-card.missed{border-left-color:#7A8794}
.call-card.referred{border-left-color:#BA7517}
.call-card-header{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 16px 10px;border-bottom:1px solid #EDF1F5;align-items:start}
.caller-name{font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.caller-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.caller-meta span{font-size:11px;color:#5B6B78}
.header-scores{display:flex;gap:12px;align-items:center;text-align:right;flex-shrink:0}
.score-block{display:flex;flex-direction:column;align-items:center}
.score-num{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7A8794;margin-top:1px}
.call-card-body{padding:12px 16px;display:grid;grid-template-columns:200px 1fr;gap:14px}
.caller-info-col{display:flex;flex-direction:column;gap:8px}
.info-pill{background:#F6F8FA;border-radius:7px;padding:8px 10px}
.info-pill .ip-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7A8794;margin-bottom:3px}
.info-pill .ip-val{font-size:12px;color:#0D2132;line-height:1.4}
.transcript-col{display:flex;flex-direction:column;gap:8px}
.transcript-box{background:#F6F8FA;border-radius:7px;padding:10px 12px;flex:1}
.transcript-box .tx-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7A8794;margin-bottom:5px}
.transcript-box .tx-text{font-size:12px;color:#2B3A48;line-height:1.65}
.analysis-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px 16px;background:#F6F8FA;border-top:1px solid #EDF1F5}
.an-cell{text-align:center;padding:6px 4px}
.an-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#7A8794;margin-bottom:3px}
.an-val{font-size:11px;font-weight:700}
.scores-coaching-row{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;padding:10px 16px;border-top:1px solid #EDF1F5}
.score-bar-card{background:#F6F8FA;border-radius:7px;padding:8px 10px}
.coaching-card{background:#faeeda;border-radius:7px;padding:8px 12px;border:1px solid rgba(186,117,23,.15)}
.coaching-card.green{background:#e8f5ee;border-color:rgba(29,158,117,.15)}
.coaching-hdr{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#BA7517;margin-bottom:4px}
.coaching-hdr.green{color:#0f6e56}
.coaching-txt{font-size:11px;color:#633806;line-height:1.55}
.coaching-txt.green{color:#0f6e56}
.analyze-bar{padding:8px 16px;border-top:1px solid #EDF1F5;display:flex;align-items:center;gap:10px}
.no-analysis-note{font-size:11px;color:#7A8794;font-style:italic}
.outcome-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
@media(max-width:700px){.call-card-body{grid-template-columns:1fr}.analysis-row{grid-template-columns:repeat(3,1fr)}.scores-coaching-row{grid-template-columns:1fr}}
</style>
<style id="om-refresh">
/* OM refresh 2026-10-21: sober, card-forward, aligned */
:root{--bg:#EBEFF4;--border:#D6DEE6;--text:#0D2132;--muted:#5B6B78;--faint:#7A8794;--line-soft:#EDF1F5;
  --shadow:0 1px 2px rgba(13,33,50,.06),0 2px 6px rgba(13,33,50,.05);--radius:10px}
body{background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* top bar */
.topbar{flex-wrap:wrap;gap:10px 16px;padding:.65rem 1.5rem}
.top-l{min-width:0}.top-name{font-family:'Open Sans',sans-serif;font-weight:700;white-space:nowrap}
.top-badge{background:var(--accent);font-size:11px;padding:2px 10px}
.top-r{flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tstatus{white-space:nowrap;color:#B8C3CE}
.date-row{flex-wrap:wrap;gap:6px}
.date-input{height:30px;border-color:rgba(255,255,255,.18);background:#fff}
.bsm,.pdf-btn{height:30px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bacc{background:var(--accent);border-color:var(--accent)}
.pdf-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.pdf-btn:hover{background:rgba(255,255,255,.08);opacity:1}
/* tabs */
.nav{padding:0 1.5rem;box-shadow:0 1px 0 var(--border)}
.nav-btn{font-weight:600}.nav-btn.active{color:var(--navy);border-bottom-color:var(--accent)}
/* page width */
.view{padding:1.25rem 1.5rem 2rem;max-width:1440px;margin:0 auto}
/* cards: white on gray, border + soft shadow, same radius everywhere */
.kcard,.ccard,.calls-card,.opsc,.call-card,.dbox,.sbox,.acell{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius)}
html body .src-wrap,html body .strip,html body .camp-card{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius)}
html body .src-card{border:1px solid var(--line-soft);background:#F8FAFC;border-radius:8px;box-shadow:none}
html body .camp-note{background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow)}
/* KPI strip: one row of six, then 3x2, then 2x3 — never an orphan tile */
.kgrid{gap:12px;margin-bottom:1rem}
#kstrip{grid-template-columns:repeat(6,minmax(0,1fr))}
#okstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcard{padding:.95rem 1.05rem;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.kcard.acc{background:#fff;border-color:var(--border);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.kval{font-size:26px;font-weight:700;color:var(--navy)}
.klbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.ksub{font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chart grid: equal columns, equal heights */
.crow{gap:12px;margin-bottom:1rem;align-items:stretch}
.ccard{padding:1rem 1.1rem .9rem;display:flex;flex-direction:column;min-width:0}
.ccard h3{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.06em;margin-bottom:2px}
.csub{font-size:11px;color:var(--faint);margin-bottom:.6rem}
.cwrap{height:232px !important;position:relative;flex:none;min-width:0}
.cwrap canvas{max-width:100%}
/* call log */
.calls-hdr{padding:.8rem 1rem;flex-wrap:wrap;gap:8px}
.calls-hdr h3{color:var(--navy);font-weight:700}
.fp{flex-wrap:wrap;align-items:center}
.pill{height:26px;display:inline-flex;align-items:center;font-weight:600}
.pill.active{background:var(--navy);border-color:var(--navy);color:#fff}
#clist{padding:14px;background:#F6F8FA}
.call-card{margin-bottom:12px}
.call-card-header{border-bottom-color:var(--line-soft)}
.analysis-row,.scores-coaching-row,.analyze-bar{border-top-color:var(--line-soft)}
.info-pill,.transcript-box,.score-bar-card{background:#F6F8FA;border:1px solid var(--line-soft)}
html body #campBody{max-width:none;padding:0 0 28px}
/* sources header */
html body .src-h{font-size:11px;letter-spacing:.06em;color:var(--navy)}
html body .src-n{font-weight:700;color:var(--navy)}
/* responsive */
@media(max-width:1280px){.topbar{display:grid;grid-template-columns:1fr auto}.top-r{grid-column:1/-1;justify-content:flex-start}.tstatus{order:9;width:100%}}
@media(max-width:1180px){#kstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.crow{grid-template-columns:1fr 1fr}.crow>.ccard:last-child:nth-child(odd){grid-column:1/-1}}
@media(max-width:640px){#kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}#okstrip,.crow{grid-template-columns:1fr}
  .view{padding:1rem}.topbar,.nav{padding-left:1rem;padding-right:1rem}
  .crow>.ccard:last-child:nth-child(odd){grid-column:auto}
  .date-row{width:100%}#companySel{flex:1 1 100%}.date-row .date-input[type=date]{flex:1 1 0;min-width:0}
  .nav-btn{padding:.8rem .75rem}}

/* v6 components */
.crow.two{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.crow.split{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
.ccard.wide{min-width:0}
.kcard[role=button]{cursor:pointer}.kcard[role=button]:hover{border-color:#B9C6D3}
.funnel{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.fstep{cursor:default}.fstep[role=button]{cursor:pointer}
.flbl{display:flex;justify-content:space-between;font-size:12px;color:#2B3A48;margin-bottom:4px}.flbl b{font-size:14px;color:var(--navy)}
.fbar{height:10px;background:#EDF1F5;border-radius:5px;overflow:hidden}.fbar span{display:block;height:100%;background:var(--accent);border-radius:5px}
.fsub{font-size:10.5px;color:var(--faint);margin-top:3px}
.stages{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.srow{display:grid;grid-template-columns:minmax(130px,1.3fr) minmax(0,2fr) 44px 56px;align-items:center;gap:10px;cursor:pointer;padding:2px 4px;border-radius:6px}
.srow:hover{background:#F6F8FA}
.sname{font-size:12px;font-weight:600;color:#2B3A48;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sname span{font-weight:400;color:var(--faint);font-size:10.5px;margin-left:6px}
.sbar2{position:relative;height:8px;background:#EDF1F5;border-radius:4px}.sbar2 span{display:block;height:100%;border-radius:4px}

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
// CARE Smiles Dental (Care Hood River Dentistry, Dr. Andy Ray Burton) — single location
// on the OM CallRail account. Replaces the Oct 14 2026 caresmilesdental build.
// CallRail account 561967665 · company (UI id) 624861441 · Google Ads 464-245-1686.
// All API keys live server-side in Vercel env vars behind /api/*.
//
// The CallRail COM... id is resolved on load from companies.json (name "Care Smiles Dental",
// then the UI id 624861441). Pin it in LOCATIONS[0].id to skip the lookup.
var ACCOUNT_ID    = '561967665';                           // proven in the Oct 14 build
var ACCOUNT_MATCH = 'om performance marketing';            // fallback only
var PRACTICE_TZ   = 'America/Los_Angeles';                 // Hood River is Pacific (CallRail company is set to Mountain)
// Words AssemblyAI should transcribe correctly (practice names, towns, insurers, dental terms).
var KEYTERMS = ['CARE Smiles','CARE Smiles Dental','CARE Smiles and Skin','Care Hood River','Dr. Burton','Andy Ray Burton',
  'Hood River','The Dalles','White Salmon','Bingen','Parkdale','Odell','Cascade Locks','Mosier',
  'Delta Dental','Moda','Regence','PacificSource','Oregon Health Plan','MetLife','Aetna','Cigna','Guardian','United Concordia','Ameritas','Medicaid',
  'CareCredit','Cherry financing','Sunbit','dental implants','All-on-4','All-on-X','bone graft','ceramic implants','zirconia','PRF','ozone',
  'biological dentistry','IV sedation','oral sedation','nitrous','Invisalign','periodontal','scaling and root planing','panoramic x-ray','new patient special','Botox'];
var LOCATIONS = [
  {key:'hoodriver', id:'', legacyId:'624861441', match:'care smiles dental', name:'CARE Smiles Dental', practice:'CARE Smiles Dental', city:'Hood River, OR', accent:'#185FA5', bg:'#e6f1fb'}
];
var COMPANY_WHITELIST = LOCATIONS;   // picker + resolveCompany read this
function savedLoc(){ try{ return localStorage.getItem('cs_loc')||''; }catch(e){ return ''; } }
var START_LOC     = LOCATIONS.find(function(l){ return l.key===savedLoc(); }) || LOCATIONS[0];
var COMPANY_ID    = '';                 // set on load; switch via the location picker
var COMPANY_NAME  = START_LOC.name;
var API_BASE = '/api';
async function apiPost(path, payload){
  return fetch(API_BASE + path, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload||{})});
}
var CR_KEY = '';
function applyLocTheme(id){
  var L = LOCATIONS.find(function(l){ return l.id===id; }); if(!L) return;
  var r = document.documentElement.style;
  r.setProperty('--accent', L.accent); r.setProperty('--accent-bg', L.bg);
  var b = document.getElementById('locBadge'); if(b) b.textContent = L.city;
  var nm = document.getElementById('locName'); if(nm) nm.textContent = L.practice || L.name;
  try{ localStorage.setItem('cs_loc', L.key); }catch(e){}
}

// ── STATE ────────────────────────────────────────────────────────────────────
var calls = [], cache = {}, activeF = 'all', activeDriver = '', ch = {};
// In-memory per-location+daterange store so returning to a location already
// loaded this session is INSTANT — no CallRail refetch, no re-billing. Progressive
// transcripts/analysis keep filling these live references. "Reload calls" forces a
// fresh pull. loadGen is bumped on every load/switch to cancel stale in-flight loops.
var locCache = {};
var loadGen  = 0;

// ── DATES (default month-to-date, practice time) ──────────────────────────────
(function(){
  var p = new Intl.DateTimeFormat('en-US',{timeZone:PRACTICE_TZ,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
  var g = function(t){ return +p.find(function(x){ return x.type===t; }).value; };
  var now   = new Date(g('year'), g('month')-1, g('day'));
  var first = new Date(now.getFullYear(), now.getMonth(), 1);
  var pad   = function(n){ return String(n).padStart(2,'0'); };
  var fmt   = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  document.getElementById('dateFrom').value = fmt(first);
  document.getElementById('dateTo').value   = fmt(now);
})();

// ── CALLRAIL ─────────────────────────────────────────────────────────────────
function setLoad(m,p,s){
  document.getElementById('lmsg').textContent = m;
  document.getElementById('lsub').textContent = s || '';
  document.getElementById('lbar').style.width  = p + '%';
}

async function crFetch(path, qs){
  var r = await apiPost('/callrail', {path:path, query:qs||{}});
  if(!r.ok) throw new Error('CallRail ' + r.status + ': ' + (await r.text()).slice(0,200));
  return r.json();
}
// ── COMPANY SELECTION ─────────────────────────────────────────────────────
// The OM CallRail account hosts many unrelated companies, so selection is pinned
// to LOCATIONS above. Single location: the picker is hidden while LOCATIONS has one entry.
function setCompanyName(nm){
  if(!nm) return;
  COMPANY_NAME = nm;
  document.title = 'OM \u00b7 ' + nm;
}

function buildCompanyPicker(comps, currentId){
  if(document.getElementById('companySel')) return;
  if(!comps || comps.length < 2) return;   // single-location dashboard: no picker
  var row = document.querySelector('.date-row');
  if(!row) return;
  var sel = document.createElement('select');
  sel.id = 'companySel';
  sel.className = 'date-input';
  sel.title = 'CallRail company';
  comps.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.id; o.textContent = c.city || c.name || c.id;
    if(c.id === currentId) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(){
    var c = comps.find(function(x){ return x.id === sel.value; });
    selectLocation(sel.value, c ? c.name : COMPANY_NAME);
  };
  row.insertBefore(sel, row.firstChild);
}

function locKey(){ return COMPANY_ID + '|' + document.getElementById('dateFrom').value + '|' + document.getElementById('dateTo').value; }
// Switch location using the in-memory store when possible. If this location+date
// range was already loaded this session, restore it instantly (live, no refetch);
// otherwise fetch it once. Any answered calls still awaiting a transcript resume.
async function selectLocation(id, name){
  COMPANY_ID = id; setCompanyName(name); applyLocTheme(id);
  var k = locKey();
  if(locCache[k]){
    ++loadGen;                                   // cancel any in-flight transcription loop
    calls = locCache[k].calls; cache = locCache[k].cache;
    var f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
    document.getElementById('ts').textContent = calls.length + ' calls · ' + f + ' → ' + t;
    render();
    var pending = calls.filter(function(c){ return c.answered && !c._transcribed && !c._transcribeFailed; });
    if(pending.length) enrichTranscripts(calls);
    return;
  }
  await refreshDash();
}

async function resolveAccount(){
  if(ACCOUNT_ID) return;                 // already pinned in CONFIG
  setLoad('Finding account...', 8, 'Searching CallRail accounts');
  var data  = await crFetch('a.json', {per_page:250});
  var accts = data.accounts || [];
  var q     = (ACCOUNT_MATCH || '').toLowerCase().trim();
  var m = accts.find(function(a){ return (a.name||'').toLowerCase().indexOf(q) >= 0; });
  if(!m) m = accts.find(function(a){ return String(a.id).replace(/\D/g,'') === '257683400'; });
  if(!m){
    var names = accts.map(function(a){ return a.name + ' (' + a.id + ')'; }).join(', ');
    throw new Error('No CallRail account matched "' + ACCOUNT_MATCH + '". Accounts on this key: ' + (names || 'none'));
  }
  ACCOUNT_ID = m.id;
  console.log('[OM] Resolved account "' + m.name + '" -> ' + m.id);
}
async function resolveCompany(){
  if(COMPANY_ID){ buildCompanyPicker(COMPANY_WHITELIST, COMPANY_ID); return; } // already pinned in CONFIG
  var chosen = START_LOC;
  if(!chosen.id){
    setLoad('Finding company...', 12, 'Matching ' + chosen.name + ' in CallRail');
    var cd = await crFetch('a/' + ACCOUNT_ID + '/companies.json', {per_page:250});
    var cs = cd.companies || [];
    var hit = cs.find(function(c){ return (c.name||'').trim().toLowerCase() === chosen.match; })
           || cs.find(function(c){ return JSON.stringify(c).indexOf(chosen.legacyId) >= 0; })
           || cs.find(function(c){ return /care/i.test(c.name||'') && /(smile|hood)/i.test(c.name||''); });
    if(!hit) throw new Error('CARE Smiles company not found on CallRail account ' + ACCOUNT_ID + '. Pin its COM... id in LOCATIONS[0].id.');
    chosen.id = hit.id;
    console.log('[OM] Resolved company "' + hit.name + '" -> ' + hit.id);
  }
  COMPANY_ID = chosen.id;

async function loadCalls(){
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  await resolveAccount();
  await resolveCompany();
  setLoad('Fetching calls...', 30, COMPANY_NAME + ' · Google Ads + LSA');
  // Paginate: CallRail caps calls.json at per_page=250, so a single fetch silently
  // truncates busy months.
  // Loop every page and concatenate so no calls are dropped.
  var all = [], _page = 1, _totalPages = 1;
  do {
  var data = await crFetch('a/' + ACCOUNT_ID + '/calls.json', {
    company_id: COMPANY_ID,
    start_date: from, end_date: to,
    per_page: 250, page: _page, sort: 'start_time', order: 'desc',
    fields: 'answered,call_type,duration,start_time,customer_name,customer_phone_number,customer_city,customer_state,first_call,source,tracking_phone_number,source_name,note,voicemail,lead_explanation,lead_score,recording,medium,utm_source,campaign,keywords'
  });
  all = all.concat(data.calls || []);
  _totalPages = data.total_pages || 1;
  _page++;
  setLoad('Fetching calls...', 32, COMPANY_NAME + ' · loaded ' + all.length + ' (page ' + (_page-1) + ' / ' + _totalPages + ')');
  } while (_page <= _totalPages);
  // Filter to Google Ads + LSA only (paid), excluding the organic GMB listing
  // number. See isPaidGoogle().
  calls = all.filter(isPaidGoogle);
  // Categorization is driven ONLY by our own AssemblyAI transcript (c._txt),
  // which is populated later by enrichTranscripts(). CallRail's own AI-written
  // lead_explanation / note / lead_score are NOT used to categorize calls —
  // we keep the note as reference-only text for the few calls we can't transcribe.
  calls.forEach(function(c){
    c._crnote        = cleanLeadExplanation(c.lead_explanation || c.note || ''); // CallRail's note — reference only
    c._txt           = '';     // our transcript; empty until transcription completes
    c._transcribed   = false;
    c._transcribeFailed = false;
  });
  setLoad(calls.length + ' Google calls loaded', 80, from + ' → ' + to);
  document.getElementById('ts').textContent = calls.length + ' calls · ' + from + ' → ' + to;
}

  if(c.voicemail === true) return true;
  var t=(c._txt||'').trim(); if(!t) return false;
  var words=t.split(/\s+/).filter(Boolean).length;
  var greeting=/thank you for calling|please\s+(hold|leave)|leave a message|office hours|after\s*hours|currently closed|not available|our (regular )?(office|business) hours/i.test(t);
  return greeting && words <= 35 && (c.duration||0) < 45;
}
function voicemailResult(call){
  var dur=call.duration||0;
  return {
    outcome:'Missed / No Answer', procedure:null, urgency:'Low',
    lead_quality:null, lead_score:null, sentiment:'neutral',
    agent_score:null, agent_notes:'Reached the practice voicemail/greeting — no live agent handled this call. If the caller left a message, follow up.',
    summary:'No live answer — reached voicemail/greeting ('+Math.floor(dur/60)+'m '+String(dur%60).padStart(2,'0')+'s).',
    lost_reason:'Missed / Voicemail', ops_opportunity:null, flag_priority:null, flag_type:null,
    booked_driver:null, lost_driver:'Reached voicemail/greeting — no live agent',
    drivers:[{label:'Missed / Voicemail', detail:'Call reached the practice voicemail or automated greeting; no live agent handled it'}],
    primary_driver:'Missed / Voicemail', secondary_driver:null, tertiary_driver:null,
    has_transcript:!!(call._txt), engine:'rule:voicemail'
  };
}

function cachedAnalysis(id){ try{ var s=localStorage.getItem('an:'+ANALYSIS_VER+':'+id); return s?JSON.parse(s):null; }catch(e){ return null; } }
function cacheAnalysis(id,o){ try{ localStorage.setItem('an:'+ANALYSIS_VER+':'+id, JSON.stringify(o)); }catch(e){} }
function clearAnalysis(id){ try{ localStorage.removeItem('an:'+ANALYSIS_VER+':'+id); }catch(e){} }

// Map Claude's structured output into the result shape the dashboard renders.
function adaptAnalysis(a, call){
  var booked = (a.outcome==='New Appointment Booked' || a.outcome==='Rescheduled');
  var confirmed = (a.outcome==='Confirmed Existing');
  var st = a.stages || {}, got = 0, possible = 0;
  var scorecard = STAGES.map(function(d){
    var v = st[d.key] || {}, na = !!v.na, sc = na ? 0 : clampI(v.score, 0, d.max);
    if(!na){ got += sc; possible += d.max; }
    return {key:d.key, label:d.label, short:d.short, score:sc, max:d.max, na:na, evidence:(v.evidence||'').trim()};
  });
  var agent_score = possible ? Math.round(got / possible * 100) : null;
  var allowSet = (booked || confirmed) ? BOOKED_DRIVERS : LOST_DRIVERS;
  var primary = a.primary_reason || null;
  var contrib = (a.contributing_reason && a.contributing_reason!=='None' && allowSet.indexOf(a.contributing_reason)>=0 && a.contributing_reason!==primary) ? a.contributing_reason : null;
  var drivers = []; if(primary) drivers.push({label:primary, detail:a.primary_detail||''}); if(contrib) drivers.push({label:contrib, detail:''});
  var opp = (a.opportunity_type && a.opportunity_type!=='None') ? a.opportunity_type : null;
  return {
    outcome:a.outcome, patient_type:a.patient_type||'Unknown', is_opportunity:!!a.is_opportunity,
    procedure:a.procedure||'Unknown', procedure_category:procCategoryOf(a.procedure),
    urgency:a.urgency||'Normal', lead_quality:a.lead_quality||'warm', lead_score:clampI(a.lead_score,0,100), sentiment:a.sentiment||'neutral',
    language:a.language||'English', insurance:a.insurance_mentioned||'', pain:!!a.pain_mentioned,
    agent_score:agent_score, agent_notes:a.agent_notes||'', summary:a.summary||'',
    reason_main: primary ? driverCategory(primary) : null, reason_secondary: primary, reason_contributing: contrib,
    lost_reason:(!booked && !confirmed) ? primary : null,
    ops_opportunity:(a.coaching && a.coaching.trim()) ? a.coaching.trim() : null,
    next_action:a.next_action||'', opportunity_type:opp,
    flag_priority:(a.flag_priority && a.flag_priority!=='none') ? a.flag_priority : null,
    flag_type:a.flag_type||null,
    booked_driver: booked ? (a.primary_detail||null) : null,
    lost_driver: (!booked && !confirmed) ? (a.primary_detail||null) : null,
    drivers:drivers, primary_driver:primary, secondary_driver:contrib, tertiary_driver:null,
    scorecard:scorecard, strengths:a.strengths||[],
    has_transcript:true, engine:'claude'
  };
}

// One Claude call per transcript (browser-direct; key embedded like the others).
async function analyzeWithClaude(call){
  try{
    var body={
      model:ANALYSIS_MODEL, max_tokens:3000,
      system:[{type:'text', text:ANALYSIS_PROMPT, cache_control:{type:'ephemeral'}}],
      tools:[ANALYSIS_TOOL], tool_choice:{type:'tool', name:'record_analysis'},
      messages:[{role:'user', content:'Call metadata — answered: '+call.answered+', duration: '+(call.duration||0)+'s, source: '+(call.source_name||'')+', CallRail first-time caller: '+(call.first_call===true?'yes':call.first_call===false?'no':'unknown')+'.\n\nTRANSCRIPT:\n'+(call._txt||'')}]
    };
    var r=await apiPost('/analyze', {body:body});
    if(!r.ok){ console.error('[OM] Claude '+r.status+': '+(await r.text()).slice(0,200)); return null; }
    var d=await r.json();
    var tu=(d.content||[]).find(function(b){ return b.type==='tool_use'; });
    if(!tu || !tu.input) return null;
    var inp=tu.input;
    // Guard: a degenerate structured response (missing outcome or empty drivers)
    // falls back to the deterministic local analyzer instead of rendering blank.
    if(!inp.outcome || !inp.primary_reason || !inp.stages){ console.warn('[OM] incomplete Claude analysis — local fallback for', call.id); return null; }
    return adaptAnalysis(inp, call);
  }catch(e){ console.error('[OM] Claude analysis failed:', e); return null; }
}

// Categorize a call: Claude for answered+transcribed (cached per call); the
// deterministic local analyzer for missed / not-yet-transcribed / API failure.
async function analyzeCall(c){
  if(!c.answered) return analyzeLocally(c);
  if(isNoLiveAnswer(c)) return voicemailResult(c);   // voicemail / greeting-only — not a live call, not a dropped call
  if(!c._transcribed || !hasUsableTranscript(c._txt)) return analyzeLocally(c);
  var hit=cachedAnalysis(c.id); if(hit) return hit;
  var res=await analyzeWithClaude(c);
  if(res){ cacheAnalysis(c.id,res); return res; }
  return analyzeLocally(c);   // fallback: no/invalid key or API error
}

// Transcribe (if needed) then categorize one call, updating its card in place.
async function processCall(c, tc){
  tc = tc || cache;
  if(c.answered && c.recording && !c._transcribed){
    var tx=cachedTx(c.id);
    if(tx){ c._txt=tx; c._transcribed=true; }
    else{
      try{
        var mp3=await getSignedUrl(c);
        var t=mp3?await aaiTranscribe(mp3):null;
        if(t){ c._txt=t; c._transcribed=true; c._transcribeFailed=false; cacheTx(c.id,t); }
        else { c._transcribeFailed=true; }
      }catch(e){ c._transcribeFailed=true; }
    }
  }
  tc[c.id]=await analyzeCall(c);
  if(tc === cache) refreshCard(c);   // only touch the DOM for the active location
}


function cachedTx(id)     { try{ return localStorage.getItem('tx:'+id)||null; }catch(e){ return null; } }
function cacheTx(id, txt) { try{ localStorage.setItem('tx:'+id, txt); }catch(e){} }

async function getSignedUrl(call) {
  try {
    var r = await apiPost('/callrail', {recordingUrl: call.recording});
    if(!r.ok) return null;
    var d = await r.json();
    return d.url || d.download_url || null;
  } catch(e){ return null; }
}

async function aaiTranscribe(mp3Url) {
  try {
    var r1 = await apiPost('/transcribe', {op:'create', audio_url: mp3Url, keyterms: KEYTERMS});
    if(!r1.ok) return null;
    var job = await r1.json();
    if(!job.id) return null;
    for(var i=0; i<30; i++){
      await new Promise(function(r){ setTimeout(r, 3000); });
      var rp = await apiPost('/transcribe', {op:'status', id: job.id});
      if(!rp.ok) continue;
      var pd = await rp.json();
      if(pd.status === 'completed'){
        if(pd.utterances && pd.utterances.length) return pd.utterances.map(function(u){ return 'Speaker '+u.speaker+': '+u.text; }).join('\n');
        return pd.text || null;
      }
      if(pd.status === 'error')     return null;
    }
  } catch(e){}
  return null;
}

// Re-render a single call's card in place (used as its transcript arrives).
function refreshCard(c){
  var el = document.getElementById('r-'+c.id);
  if(el) el.outerHTML = buildCallCard(c);
}
// Stats-only refresh (KPIs / charts / opportunities) — cards are updated
// individually via refreshCard, so we don't rebuild the whole call list here.
function renderStats(){ try{ renderKpis(); renderCharts(); renderOps(); }catch(e){ console.error(e); } }

// TRANSCRIPT-FIRST PIPELINE:
//  Each answered call is transcribed (AssemblyAI), then categorized by Claude
//  from that transcript (cached per call; see analyzeCall). Missed and
//  no-recording calls are settled locally. CallRail's summary/score/tags are
//  never used to categorize.
async function enrichTranscripts(callList) {
  var gen = ++loadGen;      // this run owns the pipeline; a newer load/switch cancels it
  var myCache = cache;      // write results into THIS load's cache object, not a later one
  // Settle non-analyzable calls immediately for display.
  callList.forEach(function(c){
    if(!c.answered){ myCache[c.id] = analyzeLocally(c); }
    else if(!myCache[c.id]) myCache[c.id] = notAnalyzedResult(c);
  });
  render();

  // Only work calls that still need it — already-transcribed+analyzed calls are
  // skipped, so resuming a partially-loaded location is cheap.
  var todo = callList.filter(function(c){ return c.answered && !(c._transcribed && cachedAnalysis(c.id)); });
  if(!todo.length) return;

  var progEl = document.getElementById('tx-prog');
  if(!progEl){
    progEl = document.createElement('div');
    progEl.id = 'tx-prog';
    // In-flow status strip under the tabs — never floats over content.
    progEl.style.cssText = 'background:#E6F1FB;color:#0D2132;border-bottom:1px solid #D6DEE6;'+
      'padding:.45rem 1.5rem;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:8px';
    var navEl = document.querySelector('.nav');
    if(navEl) navEl.insertAdjacentElement('afterend', progEl); else document.body.appendChild(progEl);
  }

  for(var i=0; i<todo.length; i+=3){
    if(gen !== loadGen){ if(progEl) progEl.remove(); return; }   // stale (user switched) — stop
    var batch = todo.slice(i, i+3);
    progEl.innerHTML = '<div class="mspin"></div>Transcribing & analyzing '+(i+1)+
      '–'+Math.min(i+3,todo.length)+' / '+todo.length;
    await Promise.all(batch.map(function(c){ return processCall(c, myCache).catch(function(e){ console.error(e); }); }));
    if(gen !== loadGen){ if(progEl) progEl.remove(); return; }
    renderStats();
    if(i+3 < todo.length) await new Promise(function(r){ setTimeout(r,400); });
  }
  if(progEl) progEl.remove();
  if(gen === loadGen) render();
}



// ═══════════════════════════════════════════════════════════════════════════
//  LOCAL CALL ANALYZER v5  (transcript-native)
//
//  SOURCE OF TRUTH:
//  1. call._txt = OUR AssemblyAI transcript — the ONLY basis for categorizing
//     an answered call's content (outcome, procedure, urgency, lead quality,
//     sentiment, lost reason, coaching flags).
//  2. call.duration + call.answered — objective call facts only.
//
//  EXPLICITLY NOT USED for categorization (CallRail's own opinions):
//  - call.lead_explanation / call.note   (CallRail's AI summary — reference only)
//  - call.lead_score                      (CallRail's proprietary score)
//  - call.first_call / call.tags          (CallRail tags)
//
//  If we have no transcript of our own (no recording, or transcription failed),
//  the call is returned as NOT ANALYZED — we never fall back to CallRail to
//  guess its content. Missed (unanswered) calls get the objective
//  "Missed / No Answer" outcome without needing a transcript.
//  Regexes use bounded proximity (.{0,N}) + word boundaries so keywords can't
//  bridge unrelated parts of a long transcript (see 2026-07-13 fix history).
// ═══════════════════════════════════════════════════════════════════════════
function notAnalyzedResult(call){
  var note = !call.recording
    ? 'No recording available for this call, so no transcript could be produced — call not categorized.'
    : call._transcribeFailed
      ? 'Transcription failed for this call — call not categorized. Review the recording in CallRail directly.'
      : 'Awaiting transcript — categorization runs automatically once this call has been transcribed.';
  return {
    not_analyzed:true,
    outcome:null, procedure:null, urgency:null, lead_quality:null, lead_score:null,
    sentiment:null, agent_score:null, agent_notes:note, summary:null,
    lost_reason:null, ops_opportunity:null, flag_priority:null, flag_type:null,
    booked_driver:null, lost_driver:null, has_transcript:false
  };
}

function analyzeLocally(call) {
  var dur = call.duration || 0;

  // Missed calls: outcome is an objective fact (nobody answered). No transcript
  // needed, and we never guess the content of a call that went to voicemail.
  if (!call.answered) {
    return {
      outcome:'Missed / No Answer', procedure:null, urgency:'Low',
      lead_quality:null, lead_score:null, sentiment:'neutral',
      agent_score:0, agent_notes:'Call not answered — went to voicemail.',
      summary:'Missed call ('+Math.floor(dur/60)+'m '+String(dur%60).padStart(2,'0')+'s). Not answered.',
      lost_reason:'Missed / Voicemail', ops_opportunity:null,
      flag_priority:null, flag_type:null,
      booked_driver:null, lost_driver:'No live agent answered the call',
      drivers:[{label:'Missed / Voicemail', detail:'Call rang through to voicemail — no live agent answered'}],
      primary_driver:'Missed / Voicemail', secondary_driver:null, tertiary_driver:null,
      has_transcript:false
    };
  }

  // Answered, but categorization runs ONLY on our own transcript — never on
  // CallRail's summary. If we have no transcript yet (still transcribing,
  // transcription failed, or no recording exists), mark it Not analyzed.
  if (!call._transcribed || !hasUsableTranscript(call._txt)) {
    return notAnalyzedResult(call);
  }

  // ── Everything below is derived from OUR transcript only. ─────────────────
  var raw = call._txt;
  var txt = raw.toLowerCase();
  var hasText = true;

  // Referral / service-not-offered signals (EN + ES). Some callers need a
  // service this location doesn't provide (e.g. sedation for a root canal, or
  // special-needs care) and are correctly pointed to another provider/location.
  // That is a referral/handoff — NOT a failed close — so it must not be coached
  // as "use an assumptive close."
  var refOtherLoc   = /our\s+other\s+(location|office)|the\s+other\s+(location|office)|another\s+(of\s+our\s+)?(location|office)|other\s+location|nuestra\s+otra\s+(oficina|ubicaci[oó]n)|la\s+otra\s+(oficina|ubicaci[oó]n)|otra\s+(oficina|ubicaci[oó]n)/i.test(txt);
  // Sedation is a service this location does NOT offer — a recurring reason
  // callers can't be served here. Detect the request + a negative response,
  // even when the "we don't" answer is standalone (as in real transcripts).
  var sedationReq   = /sedat|put\s+(patients?|me|him|her|them|you)\s+(under|to\s+sleep)|iv\s+sedation|general\s+anesthesia|sleep\s+dentistry|sedaci[oó]n|anestesia\s+general|dormir(me|lo|la)/i.test(txt);
  var negResponse   = /we\s+(don.?t|do\s+not)\b|don.?t\s+(do|offer|perform)\b|not\s+something\s+we\b|no\s+(hacemos|ofrecemos|sedamos)|no\s+lo\s+hacemos/i.test(txt);
  var refServiceGap = /we\s+(don.?t|do\s+not)\s+(do|offer|perform|sedate|put\b.{0,25}under)|don.?t\s+(sedate|do\s+that\s+here|offer\s+that)|not\s+something\s+we\s+(do|offer)|no\s+(hacemos|ofrecemos|sedamos)|no\s+(lo\s+)?hacemos\s+aqu[ií]/i.test(txt);
  var serviceNotOffered = refServiceGap || (sedationReq && negResponse);
  var refProvider   = /\bdr\.?\s+[a-z]+\b.{0,30}(does|handles|specializ|sees)|does\s+special\s+needs|special\s+needs\s+(adult|patient)|you.?d?\s+(have|want|need)\s+to\s+(see|go|call)|tendr[ií]a\s+que\s+(ir|ver|llamar)|necesidades\s+especiales/i.test(txt);
  var referredCall  = refOtherLoc || (serviceNotOffered && refProvider);

  // Insurance rejection is often phrased "do you take X insurance? … no, we do
  // not" — the negation is separated from the word "accept", so detect an
  // insurance TOPIC plus a REJECTION signal rather than requiring "not accept".
  var insTopic  = /\binsurance\b|\bmedicaid\b|\bmedicare\b|\bppo\b|\bhmo\b|delta\s+dental|\bcigna\b|\baetna\b|metlife|guardian|united\s?health|humana|meridian|blue\s?cross|dental\s+plan|aseguranza|seguro\s+dental/i.test(txt);
  var insReject = /unfortunately,?\s*(no|we)\b|no,?\s*(we|i)\s+(do\s+not|don.?t)\b|we\s+(do\s+not|don.?t)\s+(take|accept|carry)|(do|does)\s+not\s+(take|accept|carry)|doesn.?t\s+(take|accept|carry)|not\s+accepted?\b|no\s+(aceptamos|tomamos|recibimos)/i.test(txt);
  var insNotAccepted = /\bmedicaid\b|county\s+care/i.test(txt) || (insTopic && insReject);

  // ── OUTCOME ──────────────────────────────────────────────────────────────
  var outcome = 'Not Booked';
  {
    // Booking confirmed — explicit scheduling language in the transcript
    var bookPats = [
      /scheduled\s+(him|her|them|the\s+(patient|caller)|a|an)\s+(for|at|on)/i,
      /appointment\s+(was\s+)?(booked|scheduled|confirmed|set\s+up)/i,
      /booked\s+(the\s+patient\s+)?(for|an|a|the)/i,
      /confirmed\s+(for|an?\s+appointment|the\s+appointment)/i,
      /set\s+(up\s+)?(an?\s+)?appointment\s+(for|on|at)/i,
      /will\s+(come|see\s+the\s+doctor|visit)\s+(in|the\s+office|on)/i,
      /coming\s+in\s+(on|at|for)\s+/i,
      /see\s+you\s+(on|at|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday)/i,
      /appointment\s+(on|at)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday|\d)/i,
      /appointment\s+.*\d{1,2}:\d{2}/i,
      /\d{1,2}:\d{2}\s*(am|pm)\s+appointment/i,
      /successfully\s+(scheduled|booked)/i,
      /patient\s+was\s+(scheduled|booked)/i,
      /caller\s+was\s+(scheduled|booked)/i,
      /new\s+appointment\s+(was\s+)?(made|created|set)/i,
      /slot\s+(was\s+)?reserved/i,
      /will\s+be\s+seen\s+(on|at|tomorrow)/i,
      /is\s+(scheduled|booked|set)\s+(to\s+come\s+in|for)/i,
      // Natural conversational confirmations (common in real transcripts, not
      // in CallRail's own summaries): "we will see him ... at 3 o'clock",
      // "let's get her in Thursday at 3", etc.
      /we\s+will\s+see\s+(him|her|them|you)\b/i,
      /\bsee\s+(him|her|them|you)\b.{0,60}(o.?clock|\d{1,2}:\d{2}|\bam\b|\bpm\b)/i,
      /get\s+(him|her|them|you)\s+in\b.{0,60}(o.?clock|\d{1,2}:\d{2}|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i,
      // Natural front-desk booking confirmations
      /put\s+you\s+(down|in)\s+(for|on|at)/i,
      /(got|have)\s+you\s+(down|in|scheduled|set|booked)\s+(for|on|at)/i,
      /you.?re\s+(all\s+)?(set|scheduled|booked)\s+(for|on|at|up)/i,
      /i.?(ve|ll)?\s*(got|put|get)\s+you\b.{0,25}\b(for|on|at)\b.{0,20}(o.?clock|\d{1,2}(:\d{2})?|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow)/i,
      /go\s+ahead\s+and\s+(book|schedule|set)\b/i,
      // Spanish booking confirmations (heavily bilingual El Paso/Socorro client)
      /le\s+(hice|hago|puse|agend[eé]|program[eé])\s+(la|una|su)?\s*cita/i,
      /(su|la|una)\s+cita\s+(es|queda|ser[aá]|para)\b/i,
      /cita\s+(para|el|para\s+el)\s+(hoy|ma[ñn]ana|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|\d)/i,
      /queda\s+(agendad|programad|confirmad|apuntad)/i,
      /(nos\s+vemos|l[oa]\s+espero|le\s+espero|lo\s+esperamos)\s+(el|la|hoy|ma[ñn]ana|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|a\s+las)/i,
      /le\s+(agendo|programo|apunto)\b/i,
    ];
    for (var i = 0; i < bookPats.length; i++) {
      if (bookPats[i].test(raw)) { outcome = 'New Appointment Booked'; break; }
    }

    // Other outcomes — bounded proximity so keywords must appear near each other
    if (outcome === 'Not Booked') {
      if (/reschedul\w*\b.{0,30}\b(to|appointment|for)\b|appointment.{0,20}moved/i.test(txt)) outcome = 'Rescheduled';
      else if (/existing\s+appointment|already\s+(have|had|got)\s+an?\s+appointment|confirm\w*\b.{0,25}existing/i.test(txt)) outcome = 'Confirmed Existing';
      else if (referredCall || /referr?ed?\b.{0,15}\bto\b.{0,20}(specialist|oral\s+surgeon|endodontist|periodontist|another)/i.test(txt)) outcome = 'Referred Out';
      else if (/cancel\w*\b.{0,25}appointment|appointment.{0,20}cancel/i.test(txt)) outcome = 'Cancelled';
    }
  }

  // ── PROCEDURE — from summary text only ───────────────────────────────────
  var procedure = 'Unknown';
  if (hasText) {
    var procs = [
      ['Root Canal',          /root\s*canal|endodont|endodoncia|\bcanal\b/i],
      ['Extraction',          /extract|pull\s+(a\s+)?tooth|remove\s+(a\s+)?tooth|tooth\b.{0,15}remov|extracci[oó]n|sacar\s+(un\s+)?(diente|muela)|quitar\s+(un\s+)?(diente|muela)/i],
      ['Implant',             /implant/i],
      ['Wisdom Teeth',        /wisdom|muela\s+del\s+juicio|cordal/i],
      ['Filling Restoration', /filling|cavity|cavities|restoration|relleno|tapadura|caries|empaste/i],
      ['Crown Bridge',        /crown|bridge|corona|puente/i],
      ['Denture Partial',     /denture|partial|dentadura|placa\b|parcial/i],
      ['Hygiene Cleaning',    /clean|hygiene|prophylaxis|limpieza/i],
      ['Whitening',           /whitening|bleach|blanqueamiento/i],
      ['Invisalign',          /invisalign|aligner|braces|orthodont|frenos|ortodoncia|brackets/i],
      ['New Patient Exam',    /new\s+patient|checkup|check.up|routine\s+exam|paciente\s+nuevo|revisi[oó]n|chequeo|examen/i],
      ['Emergency Pain',      /pain|emergency|swelling|abscess|broken|chipped|cracked|toothache|dolor|hinchad|quebrad|astillad|muela\s+picada/i],
      ['Consultation',        /consult|second\s+opinion|consulta|segunda\s+opini[oó]n/i],
    ];
    for (var pi = 0; pi < procs.length; pi++) {
      if (procs[pi][1].test(txt)) { procedure = procs[pi][0]; break; }
    }
  }

  // ── URGENCY — from summary text only ─────────────────────────────────────
  var urgency = 'Normal';
  if (hasText) {
    // Guard: transcripts often contain "no pain" / "not in pain" — don't let a
    // bare "pain" mention alone escalate those calls to High urgency.
    var painNeg = /\bno\b.{0,8}pain|not\s+in\s+pain|isn.?t\s+in\s+pain|pain[-\s]?free|painless|no\s+(tengo|tiene|me)\s+(dolor|duele)|sin\s+dolor|no\s+me\s+duele/i.test(txt);
    if (/emergency|severe\s+pain|abscess|swelling|swollen|unbearable|knocked\s+out|bleeding|can.?t\s+(eat|sleep|chew)|emergencia|dolor\s+(fuerte|severo|insoportable)|hinchad|absceso|sangrand|no\s+aguanto/i.test(txt)) urgency = 'Emergency';
    else if (!painNeg && /\bpain\b|hurt\w*|toothache|throbbing|asap|same[-\s]?day|\burgent\b|\bimmediate\w*|broke\w*\s+(a\s+)?tooth|chipped|cracked|me\s+duele|tengo\s+dolor|hoy\s+mismo|lo\s+antes\s+posible|quebrad|astillad/i.test(txt)) urgency = 'High';
    else if (/no\s+urgency|not\s+urgent|flexible|whenever|no\s+rush|no\s+hurry|when\w*\b.{0,20}convenient|no\s+hay\s+(prisa|apuro)|cuando\s+(pueda|guste)/i.test(txt)) urgency = 'Low';
  } else if (dur < 30) {
    urgency = 'Low'; // very short call, no content to read
  }

  // ── LEAD QUALITY — derived from summary text content only ────────────────
  // Do NOT use call.lead_score — that is CallRail's own computation
  var lead_quality = 'warm'; // default if we can't read text
  var lead_score   = 50;     // internal estimate, NOT from CallRail

  if (hasText) {
    // Build a score from what the text tells us about the caller
    var lScore = 0;

    // Need signals (+)
    if (/specific\s+need|inquir\w*\b.{0,15}about|looking\s+for|need\w*\b.{0,15}dental|dental\b.{0,15}need/i.test(txt)) lScore += 20;
    if (procedure !== 'Unknown' && procedure !== 'General Inquiry') lScore += 15;
    if (urgency === 'Emergency') lScore += 25;
    else if (urgency === 'High') lScore += 15;

    // Fit signals (+)
    if (/insurance\b.{0,20}accept|accept\w*\b.{0,20}insurance|in[-\s]?network/i.test(txt)) lScore += 15;
    if (/new\s+patient|first\s+(time|call|visit)/i.test(txt)) lScore += 5;

    // Intent/commitment signals (+)
    if (/ready\b.{0,15}book|want\w*\b.{0,15}appointment|need\w*\b.{0,15}appointment|schedule\b.{0,15}soon/i.test(txt)) lScore += 15;
    if (outcome === 'New Appointment Booked') lScore += 10;
    if (dur >= 180) lScore += 5; // longer call = more engaged

    // Negative signals (-)
    if (/\bnot\b.{0,15}accept|doesn.?t\s+accept|does\s+not\s+accept|medicaid|county\s+care/i.test(txt)) lScore -= 20;
    if (/poor\s+fit|misaligned|not\s+interested|no\s+interest/i.test(txt)) lScore -= 25;
    if (/wrong\s+number|misdial|unrelated/i.test(txt)) lScore -= 40;
    if (/disengaged|ended\b.{0,15}abruptly|hung\s+up|disconnected/i.test(txt)) lScore -= 10;
    if (dur < 30) lScore -= 20;

    lead_score = Math.max(0, Math.min(100, 40 + lScore)); // base of 40

    if (lead_score >= 65) lead_quality = 'hot';
    else if (lead_score < 30) lead_quality = 'cold';
    else lead_quality = 'warm';
  }

  // ── SENTIMENT — from summary text only ───────────────────────────────────
  var sentiment = 'neutral';
  if (hasText) {
    if (/positive|satisfied|happy|pleased|friendly|grateful|enthusiastic|great\s+experience/i.test(txt)) sentiment = 'positive';
    if (/frustrated|upset|angry|disappointed|rude|dissatisfied|irritated|complain/i.test(txt)) sentiment = 'negative';
  }

  // (Agent performance is scored below, after LOST REASON — the front-desk
  //  scorecard uses the detected objection to judge objection handling.)

  // ── LOST REASON — from summary text only ─────────────────────────────────
  var lost_reason = null;
  if (outcome !== 'New Appointment Booked' && outcome !== 'Confirmed Existing' && outcome !== 'Rescheduled') {
    if (outcome === 'Missed / No Answer') {
      lost_reason = 'Voicemail No Human';
    } else if (!hasText) {
      lost_reason = dur < 45 ? 'Unclassified Short Call' : 'Other';
    } else if (outcome === 'Referred Out' || referredCall) {
      // Caller was pointed to another provider/location, or a needed service
      // isn't offered here — a handoff, not a lost lead.
      lost_reason = serviceNotOffered ? 'Service Not Offered' : 'Referred / Other Location';
    } else if (serviceNotOffered) {
      lost_reason = 'Service Not Offered';
    } else if (insNotAccepted) {
      lost_reason = 'Insurance Not Accepted';
    } else if (/out.{0,15}of.{0,15}network|out-of-network|\bnot\b.{0,20}in.{0,15}network|fuera\s+de\s+(la\s+)?red/i.test(txt)) {
      lost_reason = 'Insurance Out Of Network';
    } else if (/\bno\b.{0,30}availab|\bnot\b.{0,30}availab|couldn.t.{0,20}accommodat|could\s+not.{0,20}accommodat|\bno\b\s+(open\s+)?slot|\bno\b\s+opening|no\s+hay\s+(cita|citas|espacio|lugar|disponibilidad|nada)|no\s+tenemos\s+(cita|espacio|nada)/i.test(txt)) {
      lost_reason = 'Schedule No Fit';
    } else if (/too\s+far|location\b.{0,15}far|drive\b.{0,15}far|too\b.{0,10}far\s+to\s+travel|muy\s+lejos|queda\s+lejos/i.test(txt)) {
      lost_reason = 'Schedule No Fit';
    } else if (/will\s+call\s+back|call\s*back|callback|think\b.{0,15}about\s+it|need\s+to\s+think|consider\w*\b.{0,15}option|not\s+ready|voy\s+a\s+pensar|lo\s+pienso|d[eé]jeme\s+pensar|le\s+(hablo|llamo|marco)\s+(m[aá]s\s+tarde|despu[eé]s|luego|yo)/i.test(txt)) {
      lost_reason = 'Callback Needed';
    } else if (/\bprice\b|\bcosts?\b|\bcostly\b|expensive|\bafford\b|too\s+expensive|payment\s+concern|out\s+of\s+(my\s+)?budget|too\s+much\s+(money|to\s+pay)|muy\s+caro|est[aá]\s+caro|muy\s+costoso|no\s+me\s+alcanza|cu[aá]nto\s+(cuesta|sale|me\s+sale)/i.test(txt)) {
      // NOTE: \bafford\b (not bare "afford") — the practice name "Affordable
      // Dental" appears in every transcript and must not trigger Price Concern.
      lost_reason = 'Price Concern';
    } else if (/wrong\s+number|misdial|unrelated|not\s+looking\s+for|n[uú]mero\s+equivocad|se\s+equivoc[oó]/i.test(txt)) {
      lost_reason = 'Wrong Number';
    } else if (outcome === 'Referred Out') {
      lost_reason = 'Referred / Other Location';
    } else if (dur < 45) {
      lost_reason = 'Incomplete / Dropped Call';
    } else if (lead_score < 30) {
      // No discernible booking intent — not a genuine patient lead.
      lost_reason = 'Not a Patient Lead';
    } else {
      // Exhaustive fallback — a qualified caller the agent didn't move to a
      // booking. There is deliberately NO "Other" bucket.
      lost_reason = 'No Booking Attempt';
    }
  }

  // ═══ FRONT-DESK PERFORMANCE SCORECARD ═══════════════════════════════════
  // A balanced rubric modeled on elite dental front-desk call handling. Five
  // weighted dimensions sum to 100. The two contextual dimensions (objection
  // handling, closing) award full credit when there was no opportunity, so a
  // clean, well-handled call lands ~85-95 without having to hit every possible
  // best practice — demanding but obtainable. Everything is read from OUR
  // transcript; CallRail's score/tags are never used.
  var booked = (outcome === 'New Appointment Booked' || outcome === 'Rescheduled');
  var referred = (outcome === 'Referred Out');
  var notServed = referred || (lost_reason === 'Service Not Offered'); // can't be served here — not a failed close

  // Bilingual detectors (EN + ES) — this El Paso/Socorro client has many
  // Spanish-language calls; English-only patterns would zero their scores.
  var sig = {
    greeting:    /thank(s| you)\s+for\s+calling|thanks\s+for\s+calling|gracias\s+por\s+llamar/i.test(txt),
    agentName:   /this\s+is\s+[a-z]+|my\s+name\s+is\s+[a-z]+|[a-z]+\s+speaking\b|habla\s+[a-zá-ú]+|le\s+atiende\s+[a-zá-ú]+|mi\s+nombre\s+es/i.test(txt),
    courteous:   /you.?re\s+welcome|have\s+a\s+(great|good|wonderful|nice|blessed)|thank\s+you\s+(so|very)\s+much|my\s+pleasure|take\s+care|appreciate|que\s+(tenga|le\s+vaya)|con\s+gusto|para\s+servirle|un\s+placer/i.test(txt),
    askedNeed:   /how\s+(can|may)\s+i\s+(help|assist)|what\s+can\s+i\s+(do|help)|what\s+brings\s+you|how\s+can\s+i\s+help|en\s+qu[eé]\s+(le|te)\s+puedo\s+(ayudar|servir)|c[oó]mo\s+(le|te)\s+puedo\s+(ayudar|servir)/i.test(txt),
    identity:    /spell\s+(that|your)|last\s+name|date\s+of\s+birth|your\s+(full\s+)?name|phone\s+number|(best|call)[-\s]?back\s+number|what.?s\s+your\s+name|su\s+nombre|su\s+apellido|fecha\s+de\s+nacimiento|n[uú]mero\s+de\s+tel[eé]fono|c[oó]mo\s+se\s+llama|me\s+da\s+su\s+(nombre|tel[eé]fono)/i.test(txt),
    insuranceQ:  /insurance|medicaid|medicare|delta|cigna|aetna|metlife|guardian|united\s?health|ppo|hmo|carrier|coverage|in[-\s]?network|dental\s+plan|aseguranza|seguro\s+(dental|m[eé]dico)|su\s+seguro|tiene\s+seguro|cobertura/i.test(txt),
    probing:     /how\s+long|since\s+when|are\s+you\s+in\s+pain|level\s+of\s+pain|which\s+tooth|is\s+it\s+(hurting|swollen|bleeding)|new\s+patient|been\s+seen|last\s+(time\s+)?(visit|seen)|what.?s\s+going\s+on|desde\s+cu[aá]ndo|tiene\s+dolor|qu[eé]\s+diente|primera\s+vez|paciente\s+nuevo|qu[eé]\s+(necesita|siente|le\s+pasa)/i.test(txt),
    attribution: /how\s+did\s+you\s+hear|how.?d\s+you\s+hear|hear\s+about\s+us|found?\s+us|c[oó]mo\s+se\s+enter[oó]|c[oó]mo\s+nos\s+encontr[oó]|d[oó]nde\s+nos\s+vio/i.test(txt),
    infoGiven:   /our\s+address|we.?re\s+located|located\s+(at|on)|we.?re\s+open|our\s+hours|open\s+(monday|tuesday|wednesday|thursday|friday|from)|the\s+cost\s+(is|for)|it.?s\s+going\s+to\s+be|price\s+is|it\s+would\s+be\s+\$|estamos\s+(abiertos|ubicados)|nuestra\s+direcci[oó]n|el\s+(costo|precio)\s+es|cuesta\s+\$?\d|abrimos|nuestro\s+horario/i.test(txt),
    closeAttempt:/let.?s\s+get\s+you\s+(in|scheduled|set)|i\s+(can|could)\s+get\s+you\s+in|i\s+have\s+(an?\s+)?(opening|availability|slot)|does\s+(that|monday|tuesday|wednesday|thursday|friday|morning|afternoon|\d)\s*(work|sound)|would\s+you\s+like\s+to\s+(come\s+in|schedule|book)|shall\s+i\s+(put|book|schedule)|can\s+i\s+(get|put)\s+you\s+(down|in)|le\s+parece|le\s+gustar[ií]a\s+(venir|agendar)|puedo\s+agendarle|quiere\s+que\s+le\s+(agende|ponga|aparte)|qu[eé]\s+d[ií]a\s+le\s+queda|le\s+queda\s+bien|prefiere\s+(la\s+ma[ñn]ana|la\s+tarde)/i.test(txt),
    offeredTimes:/\d{1,2}(:\d{2})?\s*(o.?clock|am|pm)|(monday|tuesday|wednesday|thursday|friday|saturday)\s+at\b|morning\s+or\s+afternoon|earliest\s+(available|opening)|first\s+available|a\s+las\s+\d|(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)\s+(a\s+las|por\s+la)|de\s+la\s+(ma[ñn]ana|tarde)/i.test(txt),
    nextStep:    /hold\s+(a\s+)?(spot|slot|appointment)|call\s+you\s+back\s+(on|at|tomorrow|by)|send\s+you\s+(the|a|our)|text\s+you|email\s+you|put\s+you\s+(down|on\s+(the|our)\s+(schedule|books))|le\s+(hablo|llamo|marco)\s+(m[aá]s\s+tarde|despu[eé]s|ma[ñn]ana)|le\s+(mando|env[ií]o)|le\s+(aparto|guardo)\s+(el|un|su)/i.test(txt),
    altOffer:    /self[-\s]?pay|cash\s+(price|pay)|payment\s+plan|financing|care\s?credit|membership|in[-\s]?house\s+plan|discount|without\s+insurance|out[-\s]?of[-\s]?pocket|we\s+(also\s+)?offer|plan\s+de\s+pago|financiamiento|sin\s+seguro|de\s+contado|en\s+efectivo|descuento|membres[ií]a|precio\s+especial/i.test(txt),
    rude:        /\brude\b|unprofessional|yelling|hung\s+up\s+on\b|talked\s+over|dismissive|grosero|mal\s+educad|me\s+colg[oó]/i.test(txt)
  };

  var hasInsuranceObj = (lost_reason === 'Insurance Not Accepted' || lost_reason === 'Insurance Out Of Network');
  var hasPriceObj     = (lost_reason === 'Price Concern');
  var hasScheduleObj  = (lost_reason === 'Schedule No Fit');
  var hasHesitation   = (lost_reason === 'Callback Needed');
  var objectionPresent = hasInsuranceObj || hasPriceObj || hasScheduleObj || hasHesitation;

  // D1 · Greeting & etiquette (max 15)
  var d1 = (sig.greeting?6:0) + (sig.agentName?5:0) + (sig.courteous?4:0);
  if (d1 === 0) d1 = 6;                 // benefit of the doubt — transcription can clip the open
  d1 = Math.min(15, d1);
  // D2 · Discovery & probing (max 20)
  var d2 = Math.min(20, (sig.askedNeed?5:0)+(sig.identity?5:0)+(sig.insuranceQ?5:0)+(sig.probing?3:0)+(sig.attribution?2:0));
  // D3 · First-call resolution & booking (max 30)
  var d3;
  if (booked) d3 = 30;
  else if (outcome === 'Confirmed Existing') d3 = 24;
  else if (notServed) {
    // Correctly directing a caller whose need isn't served here (right provider
    // / other location) IS a form of resolution — credit it fairly.
    d3 = Math.min(24, 16 + (sig.nextStep?6:0) + ((sig.closeAttempt||sig.offeredTimes)?4:0));
  }
  else {
    d3 = (sig.infoGiven?12:0) + ((sig.closeAttempt||sig.offeredTimes)?8:0) + (sig.nextStep?6:0);
    if (hasHesitation) d3 = Math.max(d3, 6);
    d3 = Math.min(24, d3);              // a non-booking can't out-score a booking here
  }
  // D4 · Objection handling (max 15) — contextual, full credit when N/A
  var d4;
  if (!objectionPresent) d4 = 15;
  else {
    var handled = ((hasInsuranceObj||hasPriceObj) && sig.altOffer)
               || (hasScheduleObj && (sig.offeredTimes||sig.nextStep))
               || (hasHesitation && (sig.closeAttempt||sig.nextStep));
    d4 = handled ? 14 : (sig.altOffer ? 8 : 3);
  }
  // D5 · Closing & next steps (max 20) — contextual
  var d5;
  if (booked) d5 = 20;
  else if (notServed) {
    // Best practice on a referral: book them into the right location or take
    // details for a warm handoff, rather than just reading out a phone number.
    d5 = Math.min(20, 10 + (sig.nextStep?6:0) + ((sig.closeAttempt||sig.offeredTimes)?4:0));
  }
  else {
    d5 = (sig.closeAttempt?8:0)+(sig.offeredTimes?6:0)+(sig.nextStep?6:0);
    if (!objectionPresent && lead_score < 45 && sig.infoGiven) d5 = Math.max(d5, 10); // pure info call, little booking opportunity
    d5 = Math.min(20, d5);
  }
  // Professionalism modifier (capped penalty)
  var penalty = (sig.rude?15:0) + ((dur < 30 && !booked)?6:0);
  var agent_score = Math.max(5, Math.min(99, Math.round(d1+d2+d3+d4+d5-penalty)));

  var scorecard = [
    { key:'etiquette',  label:'Greeting & etiquette', score:d1, max:15 },
    { key:'discovery',  label:'Discovery & probing',  score:d2, max:20 },
    { key:'resolution', label:'Resolution & booking', score:d3, max:30 },
    { key:'objection',  label:'Objection handling',   score:d4, max:15, na:!objectionPresent },
    { key:'closing',    label:'Closing & next steps', score:d5, max:20 }
  ];

  // Strengths — surface what was done well so coaching stays balanced
  var strengths = [];
  if (sig.greeting || sig.agentName) strengths.push('Professional branded greeting');
  if (sig.identity && sig.insuranceQ) strengths.push('Captured contact + insurance');
  else if (sig.identity) strengths.push('Captured caller contact');
  if (sig.probing) strengths.push('Probed the caller’s need');
  if (booked) strengths.push('Booked the appointment');
  if (referred) strengths.push('Directed caller to the right provider/location');
  if (objectionPresent && d4 >= 12) strengths.push('Worked through the objection');
  if (!booked && sig.courteous) strengths.push('Courteous close');

  // Coaching — prioritized improvement items (impact-weighted, contextual)
  var coach = [];
  // A referral / service-not-offered call is NOT a failed close — never coach an
  // assumptive close on it. Coach the warm handoff instead.
  if (notServed) {
    if (referred && !sig.nextStep)
      coach.push({ p:'medium', t:'Caller’s need isn’t offered at this location — the agent correctly pointed them to the right provider/office. Next level: offer to book them into that location directly, or take their name and number for a warm handoff, rather than only reading out the phone number.' });
    else if (!referred)
      coach.push({ p:'low', t:'The service the caller asked for (e.g. sedation) isn’t offered at this location. If another office or provider offers it, refer them and — ideally — book or warm-transfer; otherwise capture their details so the team can follow up.' });
  } else {
    if (!booked && (urgency === 'Emergency' || urgency === 'High'))
      coach.push({ p:'high', t:'Urgent/pain caller left without an appointment. Offer the earliest slot, and if nothing is open today offer a same-day doctor callback rather than ending the call.' });
    if (!booked && lead_score >= 55 && d5 < 12 && lost_reason !== 'Wrong Number')
      coach.push({ p:'high', t:'Strong-intent caller with no firm booking attempt. Use an assumptive close — "I have [day] at [time], shall I put you down?" — instead of asking whether they’d like to schedule.' });
    if (objectionPresent && d4 <= 4) {
      if (hasInsuranceObj)      coach.push({ p:'medium', t:'Insurance wasn’t accepted and no alternative was offered. Pivot to value: "We also have self-pay and membership options — may I walk you through them?"' });
      else if (hasPriceObj)     coach.push({ p:'medium', t:'Cost was a concern with no bridge offered. Present financing/CareCredit or a phased treatment plan before the caller disengages.' });
      else if (hasScheduleObj)  coach.push({ p:'medium', t:'Timing didn’t fit and no alternative was secured. Offer two concrete options ("Thursday 3pm or Friday 10am?") or hold a tentative slot.' });
      else if (hasHesitation)   coach.push({ p:'low', t:'Caller was undecided — secure a tentative hold before hanging up: "Let me pencil you in for [time]; I can always move it."' });
    }
    if (d2 < 10) coach.push({ p:'low', t:'Thin discovery. Ask the reason for the visit, whether they’re a new patient, and their insurance up front so the call moves toward a booking.' });
  }
  if (d1 < 8)  coach.push({ p:'low', t:'Open with a branded greeting and your name — "Thank you for calling [practice], this is [name]" — to set a professional first impression.' });

  // Flag + top coaching item. Well-handled calls (booked, or high score with no
  // real gap) get no flag; polish-only issues don't flag an already-strong call.
  var flag_priority = null, ops_opportunity = null, flag_type = null;
  if (coach.length && !booked) {
    var order = {high:0, medium:1, low:2};
    coach.sort(function(a,b){ return order[a.p]-order[b.p]; });
    var top = coach[0];
    if (!(top.p === 'low' && agent_score >= 80)) {
      flag_priority = top.p;
      ops_opportunity = top.t;
      flag_type =
        referred ? 'Referral — No Warm Handoff' :
        (lost_reason === 'Service Not Offered') ? 'Service Not Offered Here' :
        (urgency==='Emergency') ? 'Emergency Patient Not Served' :
        (top.p==='high' && lead_score>=55) ? 'High-Intent Lead Not Closed' :
        hasInsuranceObj ? 'Insurance Objection — No Recovery' :
        hasPriceObj ? 'Price Objection — No Bridge' :
        hasScheduleObj ? 'No Alternative Offered' :
        hasHesitation ? 'No Hold Secured' :
        (d2 < 10) ? 'Weak Discovery' :
        (d1 < 8) ? 'Greeting / Etiquette' : 'Coaching Opportunity';
    }
  }

  // ── SUMMARY ──────────────────────────────────────────────────────────────
  var summary;
  if (!hasText) {
    summary = (call.answered ? 'Call answered' : 'Call missed') + ' (' + Math.floor(dur/60) + 'm ' + (dur%60) + 's). No CallRail summary available for this call.';
  } else {
    var sents = raw.split('. ').filter(function(s){ return s.trim().length > 15; });
    summary = sents.slice(0,2).join('. ').trim();
    if (summary && !summary.match(/[.!?]$/)) summary += '.';
  }

  // ── AGENT NOTES — concise assessment derived from the scorecard ──────────
  var agent_notes;
  if (booked) {
    agent_notes = 'Booked the appointment' + ((objectionPresent && d4>=12) ? ' after working through the caller’s objection' : '') + '. ' +
      (agent_score>=90 ? 'Excellent all-round handling.' : agent_score>=75 ? 'Solid handling — see scorecard for polish.' : 'Booked, but handling had gaps — see scorecard.');
  } else if (notServed && !ops_opportunity) {
    agent_notes = referred
      ? 'Needed service isn’t offered here — agent correctly directed the caller to the right provider/location' + (sig.nextStep ? ' and secured a handoff.' : '.')
      : 'The service the caller asked for isn’t offered at this location.';
  } else if (ops_opportunity) {
    agent_notes = ops_opportunity;
  } else {
    agent_notes = 'Handled professionally; no realistic booking opportunity was in reach on this call.';
  }

  // ═══ PRIMARY / SECONDARY / TERTIARY DRIVERS (hardcoded taxonomy) ═════════
  // Every call resolves to established drivers, evaluated in priority order:
  // the first applicable is Primary, then Secondary, then Tertiary. There is
  // deliberately NO "Other" bucket — the not-booked list below is exhaustive.
  var drivers = [];
  function pushDrv(label, detail){ if(label && !drivers.some(function(x){return x.label===label;})) drivers.push({label:label, detail:detail}); }
  if (booked) {
    // ── BOOKED drivers (why it converted) ──
    if (urgency==='Emergency'||urgency==='High')                          pushDrv('Urgency Served','Prompt/same-day slot offered to an urgent caller');
    if (/(confirm|verif)\w*\b.{0,15}insurance|in[-\s]?network/i.test(txt)) pushDrv('Insurance Cleared','Coverage confirmed — objection removed before closing');
    if (sig.altOffer)                                                     pushDrv('Cost / Plan Resolved','A payment or financing option bridged the cost');
    if (sig.closeAttempt || sig.offeredTimes)                             pushDrv('Strong Agent Close','Agent offered specific times / used an assumptive close');
    if (sig.identity && sig.insuranceQ)                                   pushDrv('Complete Intake','Captured contact + insurance to lock the booking');
    if (procedure !== 'Unknown')                                          pushDrv('Clear Need Matched','A specific dental need was identified and scheduled');
    pushDrv('Appointment Secured','Caller left with a booked appointment');
  } else if (outcome === 'Confirmed Existing') {
    pushDrv('Existing Appointment Confirmed','Returning patient confirmed an existing visit');
    pushDrv('Clear Need Matched','Handled the caller’s reason for calling');
  } else {
    // ── NOT-BOOKED drivers — accurately tiered. ──
    // TIER A = hard barriers: a concrete reason the call couldn't convert here.
    //          When one is present it is the primary cause and the label itself
    //          already conveys any missed recovery, so we do NOT pad with
    //          handling-gap drivers (that's what made a clear insurance
    //          rejection show a spurious "Incomplete / Dropped Call").
    // TIER B = handling gaps: only meaningful when the caller was genuinely
    //          bookable here (no hard barrier). These stack as secondary/tertiary.
    if (referred)                        pushDrv('Referred to Other Location','Need not offered here — caller sent to the right provider/office');
    if (serviceNotOffered && !referred)  pushDrv('Service Not Offered Here','Requested service (e.g. sedation) isn’t available at this location');
    if (lost_reason === 'Wrong Number')  pushDrv('Not a Patient Lead','Wrong number / not a booking inquiry');
    if (hasInsuranceObj)                 pushDrv(sig.altOffer?'Insurance Barrier':'Insurance Objection — No Recovery', sig.altOffer?'Insurance not accepted; an alternative was discussed':'Insurance not accepted; no self-pay/membership was offered');
    if (hasScheduleObj)                  pushDrv('Availability Mismatch','No offered slot fit the caller’s timing or urgency');
    if (hasPriceObj)                     pushDrv(sig.altOffer?'Cost Barrier':'Cost Objection — No Bridge', sig.altOffer?'Cost was raised and an option discussed':'Cost was raised with no financing/value bridge');
    var hardBarrier = drivers.length > 0;
    if (!hardBarrier) {
      // Tier B — handling gaps (bookable caller, agent could have done more).
      // A very short call had no time to convert, so that's the primary cause;
      // remaining gaps stack as secondary/tertiary.
      if (dur < 45)                        pushDrv('Incomplete / Dropped Call','Call ended before a qualifying conversation could develop');
      if (hasHesitation && !sig.nextStep)  pushDrv('Undecided — No Hold Secured','Caller deferred and no tentative hold was secured');
      if (lead_score>=45 && d5<8)          pushDrv('No Booking Attempt','Agent engaged but never attempted to close');
      if (d2<8)                            pushDrv('Weak Discovery / Qualification','Caller’s need / insurance was not uncovered');
    }
    // Guaranteed fallback — only if nothing above matched. Never "Other".
    if (!drivers.length) pushDrv(lead_score<30 ? 'Not a Patient Lead' : (dur<45 ? 'Incomplete / Dropped Call' : 'No Booking Attempt'), lead_score<30 ? 'No clear patient/booking intent in the call' : (dur<45 ? 'Call ended before a qualifying conversation' : 'No firm booking attempt was made'));
  }
  var primary_driver   = drivers[0] ? drivers[0].label : null;
  var secondary_driver = drivers[1] ? drivers[1].label : null;
  var tertiary_driver  = drivers[2] ? drivers[2].label : null;

  var booked_driver = booked ? (drivers[0] ? drivers[0].detail : 'Caller booked') : null;
  var lost_driver   = (!booked && outcome!=='Missed / No Answer' && outcome!=='Confirmed Existing') ? (drivers[0] ? drivers[0].detail : null) : null;
  // The non-booking reason shown in the chart/pill IS the primary driver — so it
  // comes from the hardcoded taxonomy and is never "Other".
  if (!booked && outcome!=='Missed / No Answer' && outcome!=='Confirmed Existing' && primary_driver) lost_reason = primary_driver;

  return {
    outcome: outcome, procedure: procedure, urgency: urgency,
    lead_quality: lead_quality, lead_score: lead_score, sentiment: sentiment,
    agent_score: agent_score, agent_notes: agent_notes, summary: summary,
    lost_reason: lost_reason, ops_opportunity: ops_opportunity,
    flag_priority: flag_priority, flag_type: flag_type,
    booked_driver: booked_driver, lost_driver: lost_driver,
    drivers: drivers, primary_driver: primary_driver, secondary_driver: secondary_driver, tertiary_driver: tertiary_driver,
    scorecard: scorecard, strengths: strengths,
    has_transcript: true
  };
}

function sc(s){ return s>=75?'#1D9E75':s>=55?'#BA7517':'#E24B4A'; }
